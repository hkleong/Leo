<title>暮色公路</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1c1730">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* Layout: full-bleed canvas road at dusk; HUD pinned to the safe-area corners; steering = left / right half of the screen */
:root{
  --night:#1c1730;
  --panel:rgba(30,22,48,.78);
  --line:rgba(255,243,223,.16);
  --cream:#fff3df;
  --muted:#d5bfcb;
  --amber:#ffb54d;
  --rose:#ef6f7f;
  --nitro:#62d8e8;
  --f-display:"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei",sans-serif;
  --f-num:"Saira Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--night);color:var(--cream);font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;
}
button{font:inherit;color:inherit;touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#touch{position:fixed;inset:0;z-index:1}

/* HUD */
.hud{
  position:fixed;top:0;left:0;right:0;z-index:3;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;
  text-shadow:0 1px 0 rgba(20,12,36,.55),0 0 12px rgba(20,12,36,.45);
  transition:opacity .3s;
}
.speed{font-family:var(--f-num);display:flex;align-items:baseline;gap:4px;line-height:1}
.speed b{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;min-width:2.1ch;text-align:right}
.speed span{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.nbar{margin-top:6px;width:min(130px,32vw);height:8px;border-radius:4px;background:rgba(20,12,36,.55);border:1px solid var(--line);overflow:hidden}
.nbar i{display:block;height:100%;width:40%;background:var(--nitro);box-shadow:0 0 10px var(--nitro);transition:width .15s linear}
.nlabel{font-size:11px;letter-spacing:.12em;color:var(--nitro);margin-top:4px}
.hud-c{text-align:center;line-height:1}
.tlabel{font-size:11px;letter-spacing:.3em;color:var(--muted);padding-left:.3em}
.time{font-family:var(--f-num);font-weight:800;font-size:56px;font-variant-numeric:tabular-nums;color:var(--amber)}
.time.low{color:var(--rose);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.hud-r{justify-self:end;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.dist{font-family:var(--f-num);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.score{font-size:12px;color:var(--muted)}
.score b{font-family:var(--f-num);font-size:16px;color:var(--cream);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;margin-top:6px}
.icon{pointer-events:auto;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(20,12,36,.5);display:grid;place-items:center;padding:0}
.icon svg{width:18px;height:18px;fill:var(--cream)}

/* steering pads (visual only — the whole half of the screen steers) */
.pads{position:fixed;left:0;right:0;bottom:0;z-index:2;pointer-events:none;display:flex;justify-content:space-between;
  padding:0 max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(14px,env(safe-area-inset-left,0px));transition:opacity .3s}
.pad{width:min(38vw,170px);height:108px;border-radius:24px;border:1.5px dashed rgba(255,243,223,.28);background:rgba(20,12,36,.18);display:grid;place-items:center;transition:background .1s,border-color .1s,transform .1s}
.pad svg{width:40px;height:40px;fill:rgba(255,243,223,.7)}
.pad.on{background:rgba(255,181,77,.22);border:1.5px solid var(--amber);transform:scale(.97)}
.pad.on svg{fill:var(--amber)}

.act{position:fixed;z-index:4;width:76px;height:76px;border-radius:50%;border:none;padding:0;display:grid;place-items:center;
  bottom:calc(env(safe-area-inset-bottom,0px) + 140px);font-weight:700;font-size:15px;letter-spacing:.08em;transition:transform .08s,opacity .3s}
.act:active,.act.on{transform:scale(.92)}
.brake{left:max(20px,calc(env(safe-area-inset-left,0px) + 20px));background:rgba(20,12,36,.62);border:2px solid rgba(255,243,223,.35)}
.nitro{right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));--n:40;
  background:conic-gradient(var(--nitro) calc(var(--n)*1%),rgba(98,216,232,.16) 0);color:var(--night)}
.nitro::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#183843;z-index:-1}
.nitro{isolation:isolate;color:var(--nitro)}
.nitro.ready{box-shadow:0 0 18px rgba(98,216,232,.55)}
.nitro.empty{opacity:.55}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translateX(-50%);z-index:5;pointer-events:none;
  font-family:var(--f-display);font-size:30px;color:var(--amber);white-space:nowrap;text-shadow:0 2px 0 rgba(20,12,36,.7);animation:pop 1.6s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.count{position:fixed;inset:0;z-index:5;display:grid;place-items:center;pointer-events:none;font-family:var(--f-display);font-size:min(34vw,180px);color:var(--cream);text-shadow:0 6px 0 rgba(20,12,36,.6)}
.count.go{color:var(--amber)}
.flash{position:fixed;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 0 0 rgba(239,111,127,0);transition:box-shadow .35s}
.flash.hit{box-shadow:inset 0 0 90px 10px rgba(239,111,127,.65);transition:none}

body[data-phase="title"] .hud,body[data-phase="title"] .pads,body[data-phase="title"] .act,
body[data-phase="over"] .pads,body[data-phase="over"] .act{opacity:0;pointer-events:none}
body[data-phase="title"] .icon,body[data-phase="over"] .icon{pointer-events:none}

/* screens */
.screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(28,23,48,.15),rgba(28,23,48,.7))}
.card{width:min(380px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px 22px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:16px;text-align:center}
.eyebrow{font-size:12px;letter-spacing:.32em;color:var(--muted);padding-left:.32em}
.logo{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--amber);letter-spacing:.06em;text-wrap:balance;
  text-shadow:0 3px 0 #8a3e57,0 0 26px rgba(255,181,77,.35)}
.tag{color:var(--muted);font-size:15px}
.best{font-size:13px;color:var(--muted)}
.best b{font-family:var(--f-num);font-size:20px;color:var(--cream);font-variant-numeric:tabular-nums}
.cta{border:none;border-radius:999px;padding:15px 22px;background:var(--amber);color:#2a1730;font-weight:800;font-size:18px;letter-spacing:.12em;
  box-shadow:0 4px 0 #b4692a;transition:transform .08s,box-shadow .08s}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 #b4692a}
.ghost{border:1px solid var(--line);border-radius:999px;padding:12px 18px;background:transparent;color:var(--cream);font-weight:600;font-size:15px}
.how{list-style:none;margin:0;padding:0;display:grid;gap:8px;text-align:left;font-size:13.5px;color:var(--muted);line-height:1.45}
.how li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.how .k{display:grid;place-items:center;height:22px;border-radius:6px;background:rgba(255,243,223,.08);font-size:12px;color:var(--cream);font-weight:700}
.how .k.n{color:var(--nitro)}
.how .k.t{color:var(--amber)}
.keys{font-size:12px;color:var(--muted);opacity:.8}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid var(--line);border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.1em}
.stat b{font-family:var(--f-num);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.big{font-family:var(--f-num);font-weight:800;font-size:72px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.badge{align-self:center;font-size:12px;letter-spacing:.2em;padding:4px 10px 4px 12px;border-radius:999px;background:var(--rose);color:#2a1730;font-weight:800}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.row > *{flex:1 1 140px}

@media (max-height:520px){
  .card{padding:16px 18px;gap:10px;width:min(560px,100%)}
  .logo{font-size:46px}
  .how{grid-template-columns:1fr 1fr;font-size:12.5px}
  .big{font-size:52px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .stat b{font-size:20px}
  .pad{height:86px;width:min(24vw,170px)}
  .act{bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:68px;height:68px}
  .brake{left:calc(max(14px,env(safe-area-inset-left,0px)) + min(24vw,170px) + 14px)}
  .nitro{right:calc(max(14px,env(safe-area-inset-right,0px)) + min(24vw,170px) + 14px)}
  .time{font-size:44px}
  .toast{top:calc(env(safe-area-inset-top,0px) + 80px)}
}
@media (prefers-reduced-motion:reduce){
  .time.low{animation:none}
  .toast{animation-duration:.01s;animation-fill-mode:none}
}
</style>

<canvas id="game" aria-label="赛车游戏画面"></canvas>
<div id="touch" aria-hidden="true"></div>
<div id="flash" class="flash" aria-hidden="true"></div>

<div class="hud">
  <div class="hud-l">
    <div class="speed"><b id="spd">0</b><span>km/h</span></div>
    <div class="nbar"><i id="nfill"></i></div>
    <div class="nlabel">氮气</div>
  </div>
  <div class="hud-c">
    <div class="tlabel">剩余时间</div>
    <div id="time" class="time">30</div>
  </div>
  <div class="hud-r">
    <div class="dist" id="dist">0.00 km</div>
    <div class="score">得分 <b id="score">0</b></div>
    <div class="tools">
      <button id="btnMute" class="icon" aria-label="关闭声音" type="button">
        <svg id="icoSound" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7l-1.2-1.2a3.3 3.3 0 0 0 0-4.6zM18.6 6a8.6 8.6 0 0 1 0 12l-1.2-1.2a6.9 6.9 0 0 0 0-9.6z"/></svg>
        <svg id="icoMute" viewBox="0 0 24 24" hidden><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M15.5 9.2l1.2-1.2 2.3 2.3 2.3-2.3 1.2 1.2-2.3 2.3 2.3 2.3-1.2 1.2-2.3-2.3-2.3 2.3-1.2-1.2 2.3-2.3z"/></svg>
      </button>
      <button id="btnPause" class="icon" aria-label="暂停" type="button">
        <svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="pads" aria-hidden="true">
  <div class="pad" id="padL"><svg viewBox="0 0 24 24"><path d="M15.5 4 7 12l8.5 8 1.9-1.9L10.8 12l6.6-6.1z"/></svg></div>
  <div class="pad" id="padR"><svg viewBox="0 0 24 24"><path d="M8.5 4 17 12l-8.5 8-1.9-1.9 6.6-6.1-6.6-6.1z"/></svg></div>
</div>
<button id="btnBrake" class="act brake" type="button" aria-label="刹车">刹车</button>
<button id="btnNitro" class="act nitro" type="button" aria-label="氮气加速">氮气</button>

<div id="toastHost"></div>
<div id="count" class="count" hidden>3</div>

<section id="scrTitle" class="screen">
  <div class="card">
    <div class="eyebrow">日落之前 · 一路向前</div>
    <div class="logo">暮色公路</div>
    <div class="tag">太阳快落山了。赶在时间耗尽前，开得越远越好。</div>
    <ul class="how">
      <li><span class="k">◀▶</span><span>按住屏幕左半边或右半边转向，车会自动加速</span></li>
      <li><span class="k n">N</span><span>吃到青色能量罐攒氮气，按住「氮气」冲刺</span></li>
      <li><span class="k t">+s</span><span>穿过检查点拱门加时间；撞车和冲出路面会大幅减速</span></li>
    </ul>
    <div class="best">最佳成绩 <b id="tBest">0</b> 分</div>
    <button id="btnStart" class="cta" type="button">开始驾驶</button>
    <div class="keys">键盘：← → 转向 · 空格 氮气 · ↓ 刹车 · P 暂停</div>
  </div>
</section>

<section id="scrPause" class="screen" hidden>
  <div class="card">
    <div class="logo" style="font-size:48px">已暂停</div>
    <div class="row">
      <button id="btnResume" class="cta" type="button">继续</button>
      <button id="btnQuit" class="ghost" type="button">回到标题</button>
    </div>
  </div>
</section>

<section id="scrOver" class="screen" hidden>
  <div class="card">
    <div class="eyebrow">天黑了 · 时间到</div>
    <div id="oNew" class="badge" hidden>新纪录</div>
    <div class="big" id="oScore">0</div>
    <div class="stats">
      <div class="stat"><span>距离</span><b id="oDist">0.00</b></div>
      <div class="stat"><span>检查点</span><b id="oCp">0</b></div>
      <div class="stat"><span>能量罐</span><b id="oCoins">0</b></div>
      <div class="stat"><span>最佳</span><b id="oBest">0</b></div>
    </div>
    <div class="row">
      <button id="btnAgain" class="cta" type="button">再来一局</button>
      <button id="btnHome" class="ghost" type="button">标题</button>
    </div>
  </div>
</section>

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const SEG = 200, RUMBLE = 3, ROAD_W = 2000, LANES = 3;
const CAM_H = 1000, CAM_DEPTH = 1 / Math.tan(50 * Math.PI / 180), PLAYER_Z = CAM_H * CAM_DEPTH;
const DRAW_DIST = 170, FOG_DENSITY = 5;
const MAX_SPEED = SEG * 60;
const ACCEL = MAX_SPEED / 4.5, BRAKE = -MAX_SPEED * 1.1, DECEL = -MAX_SPEED / 5;
const OFFROAD_DECEL = -MAX_SPEED / 1.6, OFFROAD_LIMIT = MAX_SPEED / 4, CENTRIFUGAL = 0.3;
const NITRO_MULT = 1.4, KMH = 260, UNIT_TO_M = (KMH / 3.6) / MAX_SPEED;
const CP_EVERY = 1000, CP_LEN = CP_EVERY * SEG;
const LANE_X = [-0.66, 0, 0.66];
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- utils ---------- */
const inc = (s, i, m) => { let r = s + i; while (r >= m) r -= m; while (r < 0) r += m; return r; };
const pct = (n, t) => (n % t) / t;
const lerp = (a, b, p) => a + (b - a) * p;
const easeIn = (a, b, p) => a + (b - a) * p * p;
const easeInOut = (a, b, p) => a + (b - a) * (-Math.cos(p * Math.PI) / 2 + 0.5);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const overlap = (x1, w1, x2, w2, p = 1) => { const h = p / 2; return !((x1 + w1 * h) < (x2 - w2 * h) || (x1 - w1 * h) > (x2 + w2 * h)); };
const fogAt = (d) => 1 / Math.exp(d * d * FOG_DENSITY);
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const shade = (h, a) => { const c = hex(h).map(v => a < 0 ? v * (1 + a) : v + (255 - v) * a); return `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`; };
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
};

/* ---------- colours ---------- */
const FOG = hex('#b47b84');
const mix = (c, f) => `rgb(${(c[0] + (FOG[0] - c[0]) * f) | 0},${(c[1] + (FOG[1] - c[1]) * f) | 0},${(c[2] + (FOG[2] - c[2]) * f) | 0})`;
const COL = {
  light: { road: hex('#5e5968'), grass: hex('#38644b'), rumble: hex('#f0e7d4'), lane: hex('#f3e6c6') },
  dark: { road: hex('#57525f'), grass: hex('#2f5742'), rumble: hex('#c8473f'), lane: null }
};

/* ---------- canvas ---------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1, CX = 0, CY = 0, FX = 0, FY = 0;
let skyImg = null, layers = [];

function mk(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h); return c; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r); g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath(); }

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.75);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.max(1, Math.round(cw * DPR)); canvas.height = Math.max(1, Math.round(ch * DPR));
  W = canvas.width; H = canvas.height;
  CX = W / 2;
  FX = Math.min(W / 2, H * 0.7);
  if (ch > cw) { CY = H * 0.42; FY = H * 0.78 - CY; } else { CY = H * 0.5; FY = H * 0.45; }
  buildBackground();
}

function buildBackground() {
  const sh = Math.ceil(CY + H * 0.04);
  skyImg = mk(W, sh, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#1d2350'); gr.addColorStop(0.42, '#4f3a6c'); gr.addColorStop(0.74, '#c06d86'); gr.addColorStop(0.93, '#f0a978'); gr.addColorStop(1, '#f6c48a');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const r = mulberry32(7);
    for (let i = 0; i < 70; i++) {
      const y = r() * h * 0.38; g.globalAlpha = (1 - y / (h * 0.38)) * (0.4 + r() * 0.6);
      g.fillStyle = '#fff3df'; g.fillRect(r() * w, y, r() < 0.15 ? 2 * DPR : DPR, r() < 0.15 ? 2 * DPR : DPR);
    }
    g.globalAlpha = 1;
  });
  const lh = Math.round(Math.min(H * 0.26, W * 0.32));
  const layer = (color, base, amp, f, ph) => mk(W, lh, (g, w, h) => {
    g.fillStyle = color; g.beginPath(); g.moveTo(0, h);
    for (let x = 0; x <= w; x += 3) {
      const t = x / w * Math.PI * 2;
      const y = base * h - amp * h * (0.55 * Math.sin(t * f[0] + ph) + 0.3 * Math.sin(t * f[1] + ph * 2.1) + 0.15 * Math.sin(t * f[2] + 0.7));
      g.lineTo(x, y);
    }
    g.lineTo(w, h); g.closePath(); g.fill();

let segments = [], trackLength = 0, coinList = [];

    color: Math.floor(n / RUMBLE) % 2 ? COL.dark : COL.light,

}

}

function spawnCar() {

  const rel = inc(z, -position, trackLength);
  if (rel < 70 * SEG) z = inc(position, (70 + Math.random() * 200) * SEG, trackLength);
  const v = Math.random();
  const sprite = v < 0.18 ? 'van' + (Math.random() < 0.5 ? 0 : 1) : 'car' + Math.floor(Math.random() * 5);
  const car = { lane, offset: LANE_X[lane], target: LANE_X[lane], z, sprite, percent: 0,
    speed: MAX_SPEED * (sprite[0] === 'v' ? 0.25 + Math.random() * 0.15 : 0.32 + Math.random() * 0.3), timer: 2 + Math.random() * 8 };

const countEl = $('count'), flashEl = $('flash'), nfill = $('nfill');
function showScreen(name) { for (const k in scr) scr[k].hidden = k !== name; }
function setPhase(p) { phase = p; document.body.dataset.phase = p; }
function toast(text) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
  $('toastHost').appendChild(t); setTimeout(() => t.remove(), 1700);
}
function updateMuteIcon() { $('icoSound').hidden = muted; $('icoMute').hidden = !muted; $('btnMute').setAttribute('aria-label', muted ? '打开声音' : '关闭声音'); }
$('btnMute').addEventListener('click', () => { muted = !muted; store.set('dusk-highway-muted', muted ? '1' : '0'); updateMuteIcon(); audioInit(); });
$('btnPause').addEventListener('click', () => { if (phase === 'playing' || phase === 'countdown') pause(); });
$('btnStart').addEventListener('click', startRun);
$('btnAgain').addEventListener('click', startRun);
$('btnResume').addEventListener('click', resume);
$('btnQuit').addEventListener('click', toTitle);
$('btnHome').addEventListener('click', toTitle);
document.addEventListener('visibilitychange', () => { if (document.hidden && (phase === 'playing' || phase === 'countdown')) pause(); });

let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch (e) { wakeLock = null; } }
function letSleep() { try { wakeLock && wakeLock.release(); } catch (e) { } wakeLock = null; }

function score() { return Math.floor(distance) + coins * 50; }

function startRun() {
  audioInit(); keepAwake();
  for (const c of coinList) c.collected = false;
  position = inc(0, -12 * SEG, trackLength); odo = -12 * SEG;
  speed = 0; playerX = 0; steerVis = 0; time = 30; distance = 0; coins = 0; nitro = 40; lastCp = 0; cpCount = 0; shake = 0;
  resetCars(22);
  showScreen(null); setPhase('countdown'); countT = 3; goT = 0; countEl.hidden = false; countEl.classList.remove('go'); countEl.textContent = '3';
  tone(440, 0.18, 'square', 0.08);
}
function pause() { setPhase('paused'); showScreen('pause'); pointers.clear(); refreshSteer(); }
function resume() { audioInit(); keepAwake(); showScreen(null); setPhase(countT > 0 ? 'countdown' : 'playing'); last = performance.now(); }
function toTitle() { letSleep(); countEl.hidden = true; showScreen('title'); setPhase('title'); $('tBest').textContent = best.toLocaleString('zh-CN'); }
function gameOver() {
  setPhase('over'); letSleep(); time = 0; nitroOn = false;
  const s = score(), isNew = s > best;
  if (isNew) { best = s; store.set('dusk-highway-best', String(best)); }
  $('oScore').textContent = s.toLocaleString('zh-CN');
  $('oDist').textContent = (distance / 1000).toFixed(2);
  $('oCp').textContent = cpCount; $('oCoins').textContent = coins; $('oBest').textContent = best.toLocaleString('zh-CN');
  $('oNew').hidden = !isNew;
  tone(520, 0.25, 'triangle', 0.12, 260); setTimeout(() => tone(330, 0.45, 'triangle', 0.12, 160), 220);
  setTimeout(() => { if (phase === 'over') showScreen('over'); }, 700);
}

/* ---------- update ---------- */
function crash(newSpeed) {
  speed = newSpeed; crashCool = 0.5; if (!reduceMotion) shake = 0.45;
  buzz(70); noiseBurst(0.35, 0.4); tone(110, 0.3, 'sawtooth', 0.12, 50);
  flashEl.classList.add('hit'); requestAnimationFrame(() => requestAnimationFrame(() => flashEl.classList.remove('hit')));
}

function update(dt) {
  bobT += dt;
  shake = Math.max(0, shake - dt);
  crashCool = Math.max(0, crashCool - dt);
  const sp = speed / MAX_SPEED;

  if (phase === 'title' || phase === 'over') {
    const target = phase === 'title' ? MAX_SPEED * 0.32 : 0;
    speed = phase === 'title' ? target : speed * Math.max(0, 1 - dt * 1.6);
    const pSeg = findSegment(position + PLAYER_Z);
    bgOffset += pSeg.curve * sp * dt * 0.05;
    position = inc(position, dt * speed, trackLength);
    playerX = lerp(playerX, 0, Math.min(1, dt * 2)); steerVis = lerp(steerVis, 0, Math.min(1, dt * 6));
    updateCars(dt);
    return;
  }
  if (phase === 'countdown') {
    const before = Math.ceil(countT);
    countT -= dt;
    const now = Math.ceil(countT);
    if (countT <= 0) {
      setPhase('playing'); goT = 0.7; countEl.textContent = '出发！'; countEl.classList.add('go'); tone(880, 0.35, 'square', 0.09);
    } else if (now !== before) { countEl.textContent = String(now); tone(440, 0.18, 'square', 0.08); }
    return;
  }
  if (phase !== 'playing') return;

  if (goT > 0) { goT -= dt; if (goT <= 0) countEl.hidden = true; }

  const left = keys.l || (touchL && !touchR), right = keys.r || (touchR && !touchL);
  const braking = keys.brake || btnBrake;
  const wantNitro = keys.nitro || btnNitro;
  nitroOn = wantNitro && nitro > 0 && !braking;
  if (nitroOn) nitro = Math.max(0, nitro - dt * 26);

  const startPos = position;
  const startIdx = Math.floor((position + PLAYER_Z) / SEG);
  const pSeg0 = findSegment(position + PLAYER_Z);
  updateCars(dt);
  position = inc(position, dt * speed, trackLength);
  if (position < startPos) for (const c of coinList) c.collected = false;
  odo += dt * speed;
  distance += dt * speed * UNIT_TO_M;

  const dx = dt * 2.3 * Math.min(sp, 1);
  if (left) playerX -= dx; else if (right) playerX += dx;
  steerVis = lerp(steerVis, left ? -1 : right ? 1 : 0, Math.min(1, dt * 8));
  playerX -= dx * sp * pSeg0.curve * CENTRIFUGAL;
  bgOffset += pSeg0.curve * sp * dt * 0.05;

  const top = nitroOn ? MAX_SPEED * NITRO_MULT : MAX_SPEED;
  if (braking) speed += BRAKE * dt;
  else if (speed < top) speed = Math.min(top, speed + ACCEL * dt * (nitroOn ? 2 : 1));
  else speed = Math.max(top, speed + DECEL * dt);

  const offroad = playerX < -1 || playerX > 1;
  if (offroad && speed > OFFROAD_LIMIT) speed += OFFROAD_DECEL * dt;
  if (offroad && !reduceMotion) shake = Math.max(shake, 0.08 * sp);

  // collisions across every segment we moved through this frame
  const endIdx = Math.floor((position + PLAYER_Z) / SEG);
  const N = segments.length;
  let steps = ((endIdx - startIdx) % N + N) % N; steps = Math.min(steps, 8);
  for (let k = 0; k <= steps; k++) {
    const seg = segments[(startIdx + k) % N];
    for (const s of seg.sprites) {
      if (s.type === 'coin') {
        if (!s.collected && overlap(playerX, PW, s.offset, SPR_W(SPR.coin.worldW), 1)) {
          s.collected = true; coins++; nitro = Math.min(100, nitro + 18); tone(990, 0.12, 'triangle', 0.1, 1480);
        }
      } else if (offroad && crashCool === 0 && SPR[s.type].collide && overlap(playerX, PW, s.offset, SPR_W(SPR[s.type].worldW) * 0.6, 1)) {
        crash(MAX_SPEED / 7); playerX = clamp(playerX, -1.6, 1.6) * 0.92;
      }
    }
    if (crashCool === 0) for (const car of seg.cars) {
      if (speed > car.speed && overlap(playerX, PW, car.offset, SPR_W(SPR[car.sprite].worldW), 0.8)) {
        crash(car.speed * 0.55);
        position = inc(car.z, -PLAYER_Z - SEG * 0.6, trackLength);
        break;
      }
    }
  }
  playerX = clamp(playerX, -2.6, 2.6);
  speed = clamp(speed, 0, MAX_SPEED * NITRO_MULT);

  const cp = Math.floor((odo + PLAYER_Z) / CP_LEN);
  if (cp > lastCp) {
    lastCp = cp; cpCount++;
    const bonus = Math.round(Math.max(12, 20 - cpCount * 0.8));
    time += bonus; toast(`检查点 +${bonus} 秒`); tone(660, 0.14, 'square', 0.08); setTimeout(() => tone(990, 0.22, 'square', 0.08), 130);
    if (cars.length < 56) for (let i = 0; i < 4; i++) spawnCar();
  }
  time -= dt;
  if (time <= 0) gameOver();
}

/* ---------- render ---------- */
function project(p, camX, camY, camZ) {
  p.camera.x = -camX; p.camera.y = p.world.y - camY; p.camera.z = p.world.z - camZ;
  p.screen.scale = CAM_DEPTH / p.camera.z;
  p.screen.x = Math.round(CX + p.screen.scale * p.camera.x * FX);
  p.screen.y = Math.round(CY - p.screen.scale * p.camera.y * FY);
  p.screen.w = Math.round(p.screen.scale * ROAD_W * FX);
}
function poly(x1, y1, x2, y2, x3, y3, x4, y4, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4); ctx.closePath(); ctx.fill(); }
function renderSegment(x1, y1, w1, x2, y2, w2, fog, col) {
  const f = 1 - fog;
  ctx.fillStyle = mix(col.grass, f); ctx.fillRect(0, y2, W, y1 - y2 + 1);
  const r1 = w1 / 6, r2 = w2 / 6, l1 = w1 / 32, l2 = w2 / 32;
  const rc = mix(col.rumble, f);
  poly(x1 - w1 - r1, y1, x1 - w1, y1, x2 - w2, y2, x2 - w2 - r2, y2, rc);
  poly(x1 + w1 + r1, y1, x1 + w1, y1, x2 + w2, y2, x2 + w2 + r2, y2, rc);
  poly(x1 - w1, y1, x1 + w1, y1, x2 + w2, y2, x2 - w2, y2, mix(col.road, f));
  if (col.lane) {
    const lw1 = w1 * 2 / LANES, lw2 = w2 * 2 / LANES, lc = mix(col.lane, f);
    let lx1 = x1 - w1 + lw1, lx2 = x2 - w2 + lw2;
    for (let l = 1; l < LANES; l++) { poly(lx1 - l1 / 2, y1, lx1 + l1 / 2, y1, lx2 + l2 / 2, y2, lx2 - l2 / 2, y2, lc); lx1 += lw1; lx2 += lw2; }
  }
}
function drawSprite(spr, scale, x, y, offX, offY, clipY, alpha) {
  const img = spr.img, dw = spr.worldW * scale * FX, dh = dw * img.height / img.width;
  if (dw < 1 || dw > W * 4) return;
  x += dw * offX; y += dh * offY;
  const clipH = clipY ? Math.max(0, y + dh - clipY) : 0;
  if (clipH >= dh) return;
  ctx.globalAlpha = alpha;
  ctx.drawImage(img, 0, 0, img.width, img.height - img.height * clipH / dh, x, y, dw, dh - clipH);
  ctx.globalAlpha = 1;
}
function drawGantry(seg, alpha) {
  const p = seg.p1; if (p.camera.z < SEG) return;
  const s = p.screen.scale, w = p.screen.w, k = s * FX;
  const postW = Math.max(2, 110 * k), postH = 2300 * k, bh = 520 * k;
  const lx = p.screen.x - w * 1.12, rx = p.screen.x + w * 1.12, base = p.screen.y;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, seg.clip); ctx.clip();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#2a1f3f'; ctx.fillRect(lx - postW / 2, base - postH, postW, postH); ctx.fillRect(rx - postW / 2, base - postH, postW, postH);
  ctx.drawImage(bannerImg, lx - postW / 2, base - postH, rx - lx + postW, bh);
  ctx.restore(); ctx.globalAlpha = 1;
}
function drawBackground() {
  ctx.fillStyle = mix(COL.dark.grass, 0.85); ctx.fillRect(0, 0, W, H);
  if (skyImg) ctx.drawImage(skyImg, 0, 0);
  // sun
  const span = W * 1.6;
  const sx = ((W * 0.72 - bgOffset * 0.15 * W) % span + span) % span - W * 0.3, sy = CY - H * 0.07, sr = Math.min(W, H) * 0.085;
  const glow = ctx.createRadialGradient(sx, sy, sr * 0.6, sx, sy, sr * 3.2);
  glow.addColorStop(0, 'rgba(255,214,150,.55)'); glow.addColorStop(1, 'rgba(255,190,140,0)');
  ctx.fillStyle = glow; ctx.fillRect(sx - sr * 3.2, sy - sr * 3.2, sr * 6.4, sr * 6.4);
  ctx.fillStyle = '#ffdca2'; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
  const ly = CY + H * 0.025 - layers[0].img.height - Math.max(-H * 0.04, Math.min(H * 0.04, playerY * 0.00002 * H));
  for (const L of layers) {
    const off = ((bgOffset * L.speed * W) % W + W) % W;
    ctx.drawImage(L.img, -off, ly); ctx.drawImage(L.img, W - off, ly);
  }
  ctx.fillStyle = mix(FOG, 0); ctx.fillRect(0, ly + layers[0].img.height - 1, W, H);
}
function drawPlayer(pSeg, pPct) {
  const spr = SPR.player, s = CAM_DEPTH / PLAYER_Z;
  const camY = lerp(pSeg.p1.camera.y, pSeg.p2.camera.y, pPct);
  const sp = speed / MAX_SPEED;
  const bounce = (phase === 'playing' ? (Math.random() * 2 - 1) * sp * 1.2 * DPR : 0) + ((playerX < -1 || playerX > 1) && phase === 'playing' ? (Math.random() * 2 - 1) * 3 * DPR : 0);
  const y = CY - s * camY * FY + bounce;
  const dw = spr.worldW * s * FX, dh = dw * spr.img.height / spr.img.width;
  ctx.save(); ctx.translate(CX, y); ctx.rotate(steerVis * 0.05);
  if (nitroOn) {
    for (const ex of [-0.2, 0.2]) {
      const fl = dh * (0.18 + Math.random() * 0.12);
      const g = ctx.createRadialGradient(dw * ex, -dh * 0.18, 0, dw * ex, -dh * 0.18, fl);
      g.addColorStop(0, 'rgba(240,253,255,.95)'); g.addColorStop(0.4, 'rgba(98,216,232,.8)'); g.addColorStop(1, 'rgba(98,216,232,0)');
      ctx.fillStyle = g; ctx.fillRect(dw * ex - fl, -dh * 0.18 - fl, fl * 2, fl * 2);
    }
  }
  ctx.drawImage(spr.img, -dw / 2, -dh, dw, dh);
  if (nitroOn) {
    ctx.globalCompositeOperation = 'lighter';
    for (const ex of [-0.2, 0.2]) { ctx.fillStyle = 'rgba(98,216,232,.6)'; ctx.beginPath(); ctx.arc(dw * ex, -dh * 0.18, dw * 0.035 * (1 + Math.random()), 0, 7); ctx.fill(); }
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
}
function drawSpeedLines() {
  const sp = speed / MAX_SPEED;
  if (!nitroOn && sp < 1.02) return;
  const R = Math.hypot(W, H) / 2, n = 18;
  ctx.strokeStyle = 'rgba(255,243,223,.35)'; ctx.lineWidth = 2 * DPR;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, r1 = R * (0.55 + Math.random() * 0.25), r2 = r1 + R * 0.3;
    ctx.moveTo(CX + Math.cos(a) * r1, CY + Math.sin(a) * r1 * 0.8); ctx.lineTo(CX + Math.cos(a) * r2, CY + Math.sin(a) * r2 * 0.8);
  }
  ctx.stroke();
}

function render() {
  const N = segments.length;
  const base = findSegment(position), basePct = pct(position, SEG);
  const pSeg = findSegment(position + PLAYER_Z), pPct = pct(position + PLAYER_Z, SEG);
  playerY = lerp(pSeg.p1.world.y, pSeg.p2.world.y, pPct);
  let maxy = H, x = 0, dx = -(base.curve * basePct);

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 30 * DPR, (Math.random() - 0.5) * shake * 18 * DPR);
  drawBackground();

  for (let n = 0; n < DRAW_DIST; n++) {
    const seg = segments[(base.index + n) % N];
    seg.looped = seg.index < base.index;
    seg.fog = fogAt(n / DRAW_DIST);
    seg.clip = maxy;
    const camZ = position - (seg.looped ? trackLength : 0);
    project(seg.p1, playerX * ROAD_W - x, playerY + CAM_H, camZ);
    project(seg.p2, playerX * ROAD_W - x - dx, playerY + CAM_H, camZ);
    x += dx; dx += seg.curve;
    if (seg.p1.camera.z <= CAM_DEPTH || seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxy) continue;
    renderSegment(seg.p1.screen.x, seg.p1.screen.y, seg.p1.screen.w, seg.p2.screen.x, seg.p2.screen.y, seg.p2.screen.w, seg.fog, seg.color);
    maxy = seg.p2.screen.y;
  }

  for (let n = DRAW_DIST - 1; n > 0; n--) {
    const seg = segments[(base.index + n) % N];
    const a = Math.min(1, seg.fog * 3);
    if (seg.p1.camera.z > SEG * 0.5) {
      if (seg.gantry) drawGantry(seg, a);
      for (const car of seg.cars) {
        const s = lerp(seg.p1.screen.scale, seg.p2.screen.scale, car.percent);
        const sx = lerp(seg.p1.screen.x, seg.p2.screen.x, car.percent) + s * car.offset * ROAD_W * FX;
        const sy = lerp(seg.p1.screen.y, seg.p2.screen.y, car.percent);
        drawSprite(SPR[car.sprite], s, sx, sy, -0.5, -1, seg.clip, a);
      }
      for (const sp of seg.sprites) {
        if (sp.collected) continue;
        const s = seg.p1.screen.scale, sx = seg.p1.screen.x + s * sp.offset * ROAD_W * FX;
        const oy = sp.type === 'coin' ? -1.25 - Math.sin(bobT * 5 + seg.index) * 0.12 : -1;
        drawSprite(SPR[sp.type], s, sx, seg.p1.screen.y, -0.5, oy, seg.clip, a);
      }
    }
    if (seg === pSeg) drawPlayer(pSeg, pPct);
  }
  drawSpeedLines();
  ctx.restore();
}

function hud() {
  if (phase === 'title') return;
  setText('spd', String(Math.round(speed / MAX_SPEED * KMH)));
  setText('time', String(Math.max(0, Math.ceil(time))));
  setText('dist', (distance / 1000).toFixed(2) + ' km');
  setText('score', score().toLocaleString('zh-CN'));
  hudEl.time.classList.toggle('low', time <= 10 && phase === 'playing');
  const n = Math.round(nitro);
  if (hudCache.n !== n) {
    hudCache.n = n; nfill.style.width = n + '%'; elNitro.style.setProperty('--n', n);
    elNitro.classList.toggle('ready', n >= 30); elNitro.classList.toggle('empty', n < 1);
  }
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (phase !== 'paused') update(dt);
  render(); hud(); engineTick();
  requestAnimationFrame(frame);
}

function boot(data) {
  if (data && data.best > best) best = data.best;
  buildSprites(); buildTrack(); resize();
  position = 0; resetCars(22);
  updateMuteIcon(); toTitle();
  addEventListener('resize', resize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildBanner).catch(() => { });
  try { const h = window.claude && window.claude.hot; if (h && typeof h.snapshot === 'function') h.snapshot(() => ({ best })); } catch (e) { }
  requestAnimationFrame(t => { last = t; frame(t); });
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
