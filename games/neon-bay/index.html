<title>霓虹湾</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#0b0f1a;--fg:#f4f1ff;--hot:#ff3d8b;--sun:#ffb347;--sea:#22d3ee;--ui:rgba(10,12,24,.72);color-scheme:dark;
--disp:"Bungee",Impact,system-ui,sans-serif;--body:"Rubik",system-ui,sans-serif}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
[hidden]{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none}
.tl{position:absolute;top:calc(122px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px}
.tr{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
#money{font-family:var(--disp);font-size:22px;color:#7dff9b;text-shadow:0 2px 0 #000;font-variant-numeric:tabular-nums}
#stars{font-size:24px;letter-spacing:2px;color:#444;text-shadow:0 2px 0 #000}
#stars b{color:var(--sun)}
#hp{width:104px;height:10px;background:#300;border:2px solid #000;border-radius:3px}
#hp i{display:block;height:100%;background:linear-gradient(90deg,#ff3d3d,#ff8a5c);width:100%}
#mission{background:var(--ui);padding:6px 10px;border-left:4px solid var(--hot);border-radius:4px;max-width:200px;font-size:13px}
#mission b{font-family:var(--disp);font-size:12px;color:var(--hot);letter-spacing:.06em;display:block}
#speed{font-family:var(--disp);font-size:20px;color:var(--sea);text-shadow:0 2px 0 #000}
#mini{pointer-events:auto;cursor:pointer;position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));width:104px;height:104px;border-radius:50%;border:3px solid #000;background:#123;box-shadow:0 0 0 2px var(--hot)}
#toast{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);max-width:min(54vw,520px);width:max-content;font-family:var(--body);font-weight:600;font-size:clamp(14px,2.2vw,18px);line-height:1.4;color:#fff;background:rgba(10,8,24,.74);border-left:4px solid var(--sun);padding:6px 14px;border-radius:6px;opacity:0;transition:opacity .35s;text-align:center;pointer-events:none}
#topmsg{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:min(40vw,360px);width:max-content;font-family:var(--body);font-weight:600;font-size:13px;color:#fff;background:rgba(10,8,24,.78);border:1.5px solid #ff2a3a;padding:4px 12px;border-radius:999px;opacity:0;transition:opacity .35s;text-align:center;pointer-events:none}
#topmsg::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff2a3a;margin-right:7px;vertical-align:1px;animation:blink .5s steps(2) infinite}
@keyframes blink{50%{background:#2a6fff}}
#hint{position:absolute;bottom:calc(78px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ui);padding:6px 12px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .2s}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow-y:auto;background:linear-gradient(180deg,rgba(20,8,40,.55),rgba(20,8,40,.25) 40%,rgba(20,8,40,.8)),url(art/title.jpg) center/cover,#2a0b3d;z-index:5;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));text-align:center}
.pick{display:flex;gap:12px}
.hero{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:2px;width:132px;padding:6px 6px 8px;border:3px solid rgba(255,255,255,.25);border-radius:8px;background:rgba(20,8,40,.7);color:#fff;font-family:var(--body);cursor:pointer}
.hero img{width:100%;height:150px;object-fit:cover;object-position:top;border-radius:4px}
.hero span{font-family:var(--disp);font-size:16px;color:var(--sun)}.hero small{font-size:11px;opacity:.8}
.hero.on{border-color:var(--hot);box-shadow:0 0 18px var(--hot)}.hero:focus-visible{outline:3px solid #fff}
#title h1{font-family:var(--disp);font-size:clamp(44px,12vw,110px);margin:0;line-height:.9;color:#fff;text-shadow:4px 4px 0 #2a0b3d,8px 8px 0 rgba(0,0,0,.25)}
#title p{margin:0;max-width:520px;font-size:15px;line-height:1.6;color:#fff}
#title .keys{font-size:13px;background:rgba(0,0,0,.35);padding:10px 14px;border-radius:6px;line-height:1.8}
#start{pointer-events:auto;font-family:var(--disp);font-size:22px;padding:14px 34px;border:0;border-radius:6px;background:#2a0b3d;color:var(--sun);cursor:pointer;box-shadow:0 5px 0 #000}
#start:focus-visible{outline:3px solid #fff}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#stick{position:absolute;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);pointer-events:auto}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,61,139,.7)}
.tb{position:absolute;width:66px;height:66px;touch-action:none;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.4);color:#fff;font-family:var(--disp);font-size:13px;display:flex;align-items:center;justify-content:center;pointer-events:auto}
#touch .tb.on{background:rgba(255,61,139,.65)}
#touch .tb.car{background:rgba(34,211,238,.6);border-color:#fff}
#touch .big{width:84px;height:84px;font-size:26px}
#touch .sm{width:54px;height:54px;font-size:12px}
#touch .pill{height:124px;border-radius:42px}
#touch .hot{border-color:var(--hot);background:rgba(255,61,139,.35)}
#touch[data-mode="foot"] .drive,#touch[data-mode="drive"] .foot{display:none}
.bm-top{display:flex;justify-content:space-between;align-items:center;width:min(92vw,92vh);font-family:var(--disp);color:var(--sun);font-size:18px}
#bigmap{position:fixed;inset:0;z-index:6;background:rgba(10,8,24,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#bigmap[hidden]{display:none}
#bmc{width:min(92vw,80vh);height:min(92vw,80vh);border-radius:12px;border:3px solid #000;box-shadow:0 0 0 2px var(--hot)}
#bmClose{font-family:var(--disp);font-size:14px;padding:8px 16px;border:0;border-radius:6px;background:var(--hot);color:#fff;cursor:pointer}
#bmClose:focus-visible,#mini:focus-visible{outline:3px solid #fff}
.bm-legend{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;font-size:13px;color:#fff}
.bm-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;border:1px solid #000;vertical-align:-1px}
#xh{position:absolute;left:50%;top:46%;width:34px;height:34px;margin:-17px 0 0 -17px;border:2px solid rgba(255,255,255,.9);border-radius:50%;box-shadow:0 0 0 1px #000}
#xh::before,#xh::after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px #000}
#xh::before{left:50%;top:-8px;bottom:-8px;width:2px;margin-left:-1px}#xh::after{top:50%;left:-8px;right:-8px;height:2px;margin-top:-1px}
#xh.lock{border-color:#ff3d3d;transform:scale(.8)}#xh.lock::before,#xh.lock::after{background:#ff3d3d}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#1a0f2a;font-size:13px;font-weight:600;padding:5px 10px;border-radius:12px;border:2px solid #1a0f2a;white-space:nowrap;pointer-events:none}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:#1a0f2a;border-bottom:0}
.bub.alert{background:#ffe14d}
#wpn{pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;width:78px;padding:6px 4px 5px;border:2px solid #000;border-radius:10px;background:var(--ui);color:#fff;font-family:var(--body);box-shadow:0 0 0 2px var(--hot)}
#wpn:focus-visible{outline:3px solid #fff}#wpnIcon svg{width:58px;height:34px;display:block}#wpnName{font-size:11px;font-weight:600}
#wpnDots{display:flex;gap:3px}#wpnDots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3)}#wpnDots i.on{background:var(--sun)}
#hurt{position:absolute;inset:0;background:radial-gradient(transparent 40%,rgba(255,0,40,.8));opacity:0;transition:opacity .15s;pointer-events:none}
#newGame{pointer-events:auto;background:none;border:0;color:#fff;text-decoration:underline;font-size:13px;cursor:pointer;opacity:.85}
#cut{position:absolute;inset:0;pointer-events:none}
#cut .bar{position:absolute;left:0;right:0;height:0;background:#000;transition:height .4s}#cut .bar.t{top:0}#cut .bar.b{bottom:0}#cut.on .bar{height:12vh}
#cutTxt{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--disp);font-size:clamp(40px,10vw,90px);color:#fff;opacity:0;transform:scale(1.4);transition:opacity .35s,transform .5s;letter-spacing:.06em}
#cut.on #cutTxt{opacity:1;transform:scale(1)}#cut.dead #cutTxt{color:#ff3d5a;text-shadow:0 4px 0 #000,0 0 30px #ff0040}#cut.arrest #cutTxt{color:#7fd8ff;text-shadow:0 4px 0 #000,0 0 30px #2a6fff}
#cutSub{position:absolute;left:0;right:0;top:calc(38% + clamp(56px,13vw,120px));text-align:center;font-size:16px;color:#fff;opacity:0;transition:opacity .4s .3s}#cut.on #cutSub{opacity:.9}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:4}
@media (prefers-reduced-motion:reduce){#topmsg::before{animation:none}}
@media (prefers-reduced-motion:reduce){#toast,#hint{transition:none}}

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600&display=swap">
<div id="title">
  <h1>霓虹湾</h1>
  <p>日落时分的海滨之城。你刚出狱，口袋空空。接活、飙车、甩掉警察，攒够 $30,000 买下海边那栋别墅。</p>
  <div class="pick" role="radiogroup" aria-label="选择主角">
    <button class="hero on" id="pickF" role="radio" aria-checked="true"><img src="art/hero_f.jpg" alt=""><span>玛雅</span><small>花衬衫 · 破洞牛仔裤</small></button>
    <button class="hero" id="pickM" role="radio" aria-checked="false"><img src="art/hero_m.jpg" alt=""><span>科尔</span><small>牛仔夹克 · 工装靴</small></button>
  </div>

  <button id="newGame" hidden>放弃存档，重新开始</button>
  <div class="keys">WASD 移动·驾驶 · 鼠标拖动 转视角 · Shift 奔跑 · 空格 跳跃/手刹 · Q/1-4 切换武器 · R/右键 瞄准开关 · F 攻击 · E 上下车 · H 喇叭 · Tab 地图 · M 静音</div>
</div>
<div id="hud">
  <div class="tl"><div id="money">$0</div><div id="hp"><i></i></div><div id="mission"><b>任务</b><span id="mtext">走到粉色光柱接活</span></div></div>
  <div class="tr"><div id="stars"></div><button id="wpn" aria-label="切换武器"><span id="wpnIcon"></span><span id="wpnName">拳头</span><span id="wpnDots"></span></button><div id="speed"></div></div>
  <canvas id="mini" width="300" height="300" role="button" aria-label="打开完整地图" tabindex="0"></canvas>
  <div id="hurt"></div><div id="cut" hidden><i class="bar t"></i><i class="bar b"></i><div id="cutTxt"></div><div id="cutSub"></div></div><div id="fade"></div><div id="xh" hidden></div><div id="topmsg"></div><div id="toast"></div><div id="hint"></div>
</div>
<div id="bigmap" hidden><div class="bm-top"><b>霓虹湾地图</b><button id="bmClose" aria-label="关闭地图">关闭</button></div><canvas id="bmc"></canvas>
  <div class="bm-legend"><span><i style="background:#ff3d8b"></i>你</span><span><i style="background:#ffe14d"></i>任务</span><span><i style="background:#ff2a3a"></i>警察</span><span><i style="background:#fff"></i>别墅</span><span><i style="background:#4a7ab0"></i>警察局</span><span><i style="background:#ff2a3a"></i>医院</span><span><i style="background:#22d3ee"></i>停车场</span><span><i style="background:#5cff7a"></i>现金</span></div></div>
<div id="touch" data-mode="foot">
  <div id="stick" class="foot"><div id="knob"></div></div>
  <div class="tb foot big hot" id="bF" style="right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px))">攻击</div>
  <div class="tb foot" id="bJ" style="right:calc(124px + env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px))">跳跃</div>
  <div class="tb foot" id="bRun" style="right:calc(108px + env(safe-area-inset-right,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px))">奔跑</div>
  <div class="tb foot" id="bA" style="right:calc(32px + env(safe-area-inset-right,0px));bottom:calc(136px + env(safe-area-inset-bottom,0px))">瞄准</div>
  <div class="tb drive big" id="bL" style="left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px))">◀</div>
  <div class="tb drive big" id="bR" style="left:calc(116px + env(safe-area-inset-left,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px))">▶</div>
  <div class="tb drive big pill hot" id="bG" style="right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px));font-size:15px">油门</div>
  <div class="tb drive big" id="bB" style="right:calc(112px + env(safe-area-inset-right,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px));font-size:15px">刹车</div>
  <div class="tb drive" id="bS" style="right:calc(122px + env(safe-area-inset-right,0px));bottom:calc(132px + env(safe-area-inset-bottom,0px))">手刹</div>
  <div class="tb drive sm" id="bH" style="left:calc(124px + env(safe-area-inset-left,0px));bottom:calc(140px + env(safe-area-inset-bottom,0px))">喇叭</div>
  <div class="tb drive sm" id="bE" style="right:calc(30px + env(safe-area-inset-right,0px));bottom:calc(176px + env(safe-area-inset-bottom,0px))">下车</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== 基础 =====
const R=Math.random,rr=(a,b)=>a+R()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const N=14,BLK=70,RD=16,P=BLK+RD,HALF=N*P/2;
const road=i=>i*P-HALF; // 道路中心线 i=0..N
const ISL=a=>HALF*.93*(1+.1*Math.sin(3*a+.8)+.06*Math.sin(5*a+2.1)+.04*Math.sin(2*a+4)+.025*Math.sin(9*a+1))/Math.hypot(Math.cos(a),Math.sin(a)/.56)+34;
const coastR=(x,z)=>ISL(Math.atan2(z,x));
const onIsland=(x,z,m=0)=>Math.hypot(x,z)<coastR(x,z)-m;
const nodeOK=(i,j)=>i>=0&&j>=0&&i<=N&&j<=N&&onIsland(road(i),road(j),26);
const blockOK=(i,j)=>nodeOK(i,j)&&nodeOK(i+1,j)&&nodeOK(i,j+1)&&nodeOK(i+1,j+1);
// 特殊街区：别墅（最东南）、警察局（偏西北）、停车场（最东）
const VALID=[];for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(blockOK(i,j))VALID.push([i,j]);
const pickBlock=(f,ex=[])=>VALID.filter(b=>!ex.some(e=>e[0]===b[0]&&e[1]===b[1])).reduce((a,b)=>f(b)>f(a)?b:a);
const VB=pickBlock(b=>b[0]+b[1]),SB=pickBlock(b=>-Math.hypot(b[0]-N*.25,b[1]-N/2),[VB]),LB=pickBlock(b=>b[0]*3-Math.abs(b[1]-N/2+.5),[VB,SB]),HB=pickBlock(b=>-Math.hypot(b[0]-N*.66,b[1]-N*.42),[VB,SB,LB]);
const bc=b=>({x:road(b[0])+P/2,z:road(b[1])+P/2});const LOT=bc(LB);
// 出生点：最西边的路口
const SPN=(()=>{let best=null;for(let i=0;i<=N;i++)for(let j=0;j<=N;j++)if(nodeOK(i,j)){const v=road(i)*2+Math.abs(road(j)+80);if(!best||v<best.v)best={v,x:road(i),z:road(j)}}return best})();
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x2b1b4a);scene.fog=new THREE.Fog(0xc8607a,110,440);
// 日落天空：顶部青蓝 → 粉紫 → 地平线橙
const sky=new THREE.Mesh(new THREE.SphereGeometry(800,24,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`varying vec3 vP;void main(){float h=vP.y;vec3 top=vec3(.05,.33,.40),mid=vec3(.86,.27,.52),hor=vec3(1.,.58,.25);
   vec3 c=h>.18?mix(mid,top,smoothstep(.18,.6,h)):mix(hor,mid,smoothstep(-.02,.18,h));
   float sd=distance(vP,normalize(vec3(.9,.06,-.3)));c+=vec3(1.,.8,.4)*smoothstep(.07,.05,sd)+vec3(1.,.5,.3)*.35*smoothstep(.5,.0,sd);gl_FragColor=vec4(c,1.);}`}));
sky.renderOrder=-1;scene.add(sky);
const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.5,2200);
const ren=new THREE.WebGLRenderer({antialias:true});
const MOBILE=matchMedia('(pointer:coarse)').matches;ren.setPixelRatio(Math.min(devicePixelRatio,MOBILE?1.5:2));ren.setSize(innerWidth,innerHeight);
ren.shadowMap.enabled=true;document.body.prepend(ren.domElement);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
scene.add(new THREE.HemisphereLight(0xb7a2ff,0x4a2450,.85));
const sun=new THREE.DirectionalLight(0xffa86b,1.05);sun.position.set(200,90,-60);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-160,right:160,top:160,bottom:-160,far:500});sun.shadow.mapSize.set(MOBILE?1024:2048,MOBILE?1024:2048);
scene.add(sun,sun.target);
// 卡通分层着色（三档明暗，接近插画的赛璐璐感），按颜色缓存材质
const toonGrad=(()=>{const t=new THREE.DataTexture(new Uint8Array([90,90,90,255,170,170,170,255,255,255,255,255]),3,1,THREE.RGBAFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;return t})();
const matCache={};const M=c=>matCache[c]||(matCache[c]=new THREE.MeshToonMaterial({color:c,gradientMap:toonGrad}));
// 圆角方块：把细分方块的顶点推到圆角面上，法线直接取圆角方向，表面平滑无接缝
const geoCache={};
function rgeo(w,h,d,k){const key=[w,h,d,k].map(v=>+v.toFixed(3)).join();if(geoCache[key])return geoCache[key];
  const r=Math.min(w,h,d)*k,seg=4,g=new THREE.BoxGeometry(w,h,d,seg,seg,seg),pos=g.attributes.position,nor=g.attributes.normal;
  const hx=w/2-r,hy=h/2-r,hz=d/2-r,v=new THREE.Vector3(),n=new THREE.Vector3();
  for(let i=0;i<pos.count;i++){v.fromBufferAttribute(pos,i);n.set(clamp(v.x,-hx,hx),clamp(v.y,-hy,hy),clamp(v.z,-hz,hz));
    const dir=v.clone().sub(n);if(dir.lengthSq()<1e-9)dir.fromBufferAttribute(nor,i);dir.normalize();v.copy(n).addScaledVector(dir,r);pos.setXYZ(i,v.x,v.y,v.z);nor.setXYZ(i,dir.x,dir.y,dir.z)}
  return geoCache[key]=g}
const rbox=(w,h,d,c,k=.42)=>{const m=new THREE.Mesh(rgeo(w,h,d,k),typeof c==='number'?M(c):c);m.castShadow=m.receiveShadow=true;return m};
const leafGeo=(()=>{const g=rgeo(6,.25,1.6,.45).clone();g.translate(3,0,0);const p=g.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i);p.setY(i,p.getY(i)-x*x*.06)}g.computeVertexNormals();return g})();
const box=(w,h,d,c)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof c==='number'?M(c):c);m.castShadow=m.receiveShadow=true;return m};

// ===== 动作：每帧根据状态摆姿势 =====
// st：idle 站立 / walk 走 / run 跑 / jump 跳 / punch 出拳 / aim 举枪 / dance 跳舞 / phone 打电话 / selfie 自拍 /
//     sit 坐 / wave 招手 / talk 聊天比划 / pizza 端披萨 / coffee 端咖啡 / skate 滑轮滑 / jog 慢跑 / down 倒地
function pose(g,st,t,k=1,extra=0){const r=g.userData.rig;if(!r)return;
  const{spine,hips,knees,shs,els}=r;
  spine.rotation.set(0,0,0);spine.position.y=1.38;
  for(const h of hips)h.rotation.set(0,0,0);for(const n of knees)n.rotation.set(0,0,0);
  for(const s of shs)s.rotation.set(0,0,s.userData.z0);for(const e of els)e.rotation.set(-.12,0,0);
  const walkLegs=(ph,amp,kb)=>{const s=Math.sin(ph);hips[0].rotation.x=s*amp;hips[1].rotation.x=-s*amp;
    knees[0].rotation.x=kb*Math.max(0,-Math.cos(ph))+.05;knees[1].rotation.x=kb*Math.max(0,Math.cos(ph))+.05;return s};
  const swingArms=(s,amp,elb)=>{shs[0].rotation.x=-s*amp;shs[1].rotation.x=s*amp;els[0].rotation.x=-elb;els[1].rotation.x=-elb};
  let ph=t*10;
  switch(st){
    case'walk':{const s=walkLegs(ph,.5*k,.9*k);swingArms(s,.45*k,.35);spine.position.y+=Math.abs(Math.cos(ph))*.04*k;break}
    case'run':{ph=t*13;const s=walkLegs(ph,.85,1.5);swingArms(s,.9,1.5);spine.rotation.x=.18;spine.position.y+=Math.abs(Math.cos(ph))*.08;break}
    case'jog':{ph=t*11;const s=walkLegs(ph,.65,1.2);swingArms(s,.6,1.4);spine.rotation.x=.1;spine.position.y+=Math.abs(Math.cos(ph))*.06;break}
    case'skate':{ph=t*4;const s=Math.sin(ph);hips[0].rotation.z=-Math.max(0,s)*.35;hips[1].rotation.z=Math.max(0,-s)*.35;
      for(const n of knees)n.rotation.x=.45;for(const h of hips)h.rotation.x-=.35;spine.rotation.x=.3;spine.position.y-=.12;
      shs[0].rotation.x=s*.7;shs[1].rotation.x=-s*.7;els[0].rotation.x=els[1].rotation.x=-.4;break}
    case'jump':{for(const h of hips)h.rotation.x=-.7;for(const n of knees)n.rotation.x=1.3;
      shs[0].rotation.z=-1.2;shs[1].rotation.z=1.2;els[0].rotation.x=els[1].rotation.x=-.6;spine.rotation.x=.12;break}
    case'punch':{const p=Math.sin(Math.min(1,extra)*Math.PI);spine.rotation.y=-.35*p;
      shs[1].rotation.x=-1.5*p-.2;els[1].rotation.x=-1.9*(1-p)-.1;shs[0].rotation.x=-.6;els[0].rotation.x=-2.0;
      hips[0].rotation.x=-.3;hips[1].rotation.x=.25;knees[0].rotation.x=.25;knees[1].rotation.x=.2;break}
    case'swing':{const p=Math.min(1,extra*1.6),e=p*p*(3-2*p);spine.rotation.y=.7-1.5*e;shs[1].rotation.x=-1.6;shs[1].rotation.z=1.2-1.9*e;els[1].rotation.x=-.5+.4*e;
      shs[0].rotation.x=-1.2;shs[0].rotation.z=-.3;els[0].rotation.x=-.9;hips[0].rotation.x=-.25;hips[1].rotation.x=.2;knees[0].rotation.x=knees[1].rotation.x=.25;break}
    case'aim':{shs[1].rotation.x=-1.55;els[1].rotation.x=0;shs[0].rotation.x=-1.3;shs[0].rotation.z=.35;els[0].rotation.x=-.5;spine.rotation.y=-.15;
      if(k>0){const s=walkLegs(ph,.45*k,.8*k)}break}
    case'dance':{const b=t*8;spine.position.y-=.08+Math.abs(Math.sin(b))*.1;for(const n of knees)n.rotation.x=.35+Math.abs(Math.sin(b))*.3;for(const h of hips)h.rotation.x=-.2-Math.abs(Math.sin(b))*.15;
      spine.rotation.z=Math.sin(b/2)*.15;spine.rotation.y=Math.sin(b/4)*.4;
      shs[0].rotation.z=-2.4-Math.sin(b)*.4;shs[1].rotation.z=2.4-Math.sin(b+1)*.4;els[0].rotation.x=-.6-Math.sin(b)*.4;els[1].rotation.x=-.6-Math.cos(b)*.4;break}
    case'phone':{if(k>0){const s=walkLegs(ph,.4*k,.8*k);shs[0].rotation.x=-s*.35;}els[0].rotation.x=-.3;
      shs[1].rotation.x=-.35;shs[1].rotation.z=.55;els[1].rotation.x=-2.5;els[1].rotation.z=-.4;break}
    case'selfie':{shs[1].rotation.x=-2.2;shs[1].rotation.z=.35;els[1].rotation.x=-.25;shs[0].rotation.z=-.35;els[0].rotation.x=-1.6;
      spine.rotation.z=Math.sin(t*1.5)*.06;hips[0].rotation.z=-.08;hips[1].rotation.x=.12;knees[1].rotation.x=.25;break}
    case'sit':{spine.position.y=.78;for(const h of hips)h.rotation.x=-1.5;for(const n of knees)n.rotation.x=1.5;
      shs[0].rotation.x=shs[1].rotation.x=-.35;els[0].rotation.x=els[1].rotation.x=-.9;spine.rotation.x=-.05;break}
    case'wave':{shs[1].rotation.z=2.5;els[1].rotation.x=-.4+Math.sin(t*12)*.45;shs[0].rotation.x=0;break}
    case'talk':{const s=Math.sin(t*3);shs[0].rotation.x=-.4+s*.15;els[0].rotation.x=-1.3+Math.sin(t*5)*.3;shs[1].rotation.x=-.3-s*.2;els[1].rotation.x=-1.1+Math.cos(t*4)*.35;
      spine.rotation.y=Math.sin(t*1.3)*.12;hips[0].rotation.z=-.05;break}
    case'pizza':{if(k>0)walkLegs(ph,.45*k,.8*k);for(const s of shs){s.rotation.x=-.95;s.rotation.z=s.userData.z0*-1.4}for(const e of els)e.rotation.x=-.7;break}
    case'coffee':{if(k>0){const s=walkLegs(ph,.45*k,.85*k);shs[0].rotation.x=-s*.4;els[0].rotation.x=-.35}shs[1].rotation.x=-.25;els[1].rotation.x=-1.7;break}
    default:{ // idle：轻微呼吸
      spine.position.y+=Math.sin(t*2)*.008;els[0].rotation.x=els[1].rotation.x=-.15;knees[0].rotation.x=.04}
  }}
// 兼容旧调用：按带的道具选默认走路姿势
function animWalk(g,t,amt){const c=g.userData.carry;
  if(c==='pizza'||c==='phone'||c==='coffee')pose(g,c,t,amt>0?1:0);
  else if(c==='selfie')pose(g,amt>.05?'walk':'selfie',t,amt*1.6);
  else pose(g,amt>.95?'run':amt>.05?'walk':'idle',t,Math.min(1,amt*1.6))}

  if(p.cop){ // 警员：跑向玩家，贴身就扣血；没通缉了就离开
    const dx=player.x-p.x,dz=player.z-p.z,d=Math.hypot(dx,dz);
    if(player.wanted===0||d>120){dropPed(p);return}
    if(d<28&&performance.now()-(p.lastSay||0)>3800){p.voice=p.voice||rr(95,115);say(p,'cop')}
    p.rot=Math.atan2(dx,dz);let cst='aim',ck=0;
    const arrestMode=player.wanted<=1;
    if(arrestMode&&d>1.6||!arrestMode&&d>16){const sp=7*dt,nx=p.x+dx/d*sp,nz=p.z+dz/d*sp;if(!hit(nx,p.z,.6))p.x=nx;if(!hit(p.x,nz,.6))p.z=nz;cst='run';ck=1}
    else if(!arrestMode){p.shootT=(p.shootT??1)-dt;if(p.shootT<=0){p.shootT=rr(1.1,1.8);copShoot(p,d)}}
    else cst='idle';
    for(const c of cars)if(!c.dead&&Math.abs(c.speed)>8&&Math.hypot(c.x-p.x,c.z-p.z)<3.4){killPed(p,c===player.car);addHeat(.8);break}
    p.mesh.position.set(p.x,0,p.z);p.mesh.rotation.y=p.rot;pose(p.mesh,cst,p.t*1.2,ck);return}
  // 被打倒：躺 3 秒后爬起来逃跑
  if(p.knock>0){p.knock-=dt;p.mesh.rotation.x=-Math.PI/2;p.mesh.position.set(p.x,.35,p.z);pose(p.mesh,'idle',p.t,0);
    if(p.knock<=0){p.mesh.rotation.x=0;p.flee=6;if(p.bench){p.bench.used=null;p.bench=null}p.act='walk'}return}
  const pd=Math.hypot(player.x-p.x,player.z-p.z);
  for(const c of cars)if(!c.dead&&Math.abs(c.speed)>8&&Math.hypot(c.x-p.x,c.z-p.z)<3.4){killPed(p,c===player.car);return}
  p.flee-=dt;p.wave-=dt;p.danceT-=dt;p.pause-=dt;
  // 玩家走近，偶尔招手打招呼
  if(!p.waved&&!player.car&&pd<5&&p.flee<=0&&player.wanted===0&&R()<.5&&p.act!=='sit'){p.waved=1;p.wave=2.2;say(p,'wave')}
  let st='idle',k=0,sp=0;
  if(p.flee>0){if(!p.screamed){p.screamed=1;if(R()<.55)say(p,'flee')}if(p.bench){p.bench.used=null;p.bench=null;p.act='walk'}p.rot=Math.atan2(p.x-player.x,p.z-player.z);st='run';sp=7.5}
  else if(p.wave>0){p.rot+=angDiff(Math.atan2(player.x-p.x,player.z-p.z),p.rot)*Math.min(1,dt*6);st='wave'}
  else if(p.danceT>0||p.act==='dance')st='dance';
  else switch(p.act){
    case'sit':st='sit';break;
    case'talk':st='talk';if(pd<16&&performance.now()-(p.lastSay||0)>(p.gap||(p.gap=rr(2600,5200)))&&(!p.partner||performance.now()-(p.partner.lastSay||0)>1400)){p.gap=0;say(p,'talk')}if(p.partner&&peds.includes(p.partner)&&!p.partner.dead)p.rot=Math.atan2(p.partner.x-p.x,p.partner.z-p.z);else p.act='walk';break;
    case'selfie':case'idle':st=p.act;if(p.act==='selfie'&&pd<12&&R()<dt*.3)say(p,'selfie');if(R()<.0015)p.act='walk';break;
    case'skate':st='skate';sp=6;k=1;break;
    case'jog':st='jog';sp=5;k=1;break;
    default: // walk / phone / pizza / coffee：边走边做，偶尔停下来
      if(p.pause>0){st=p.act==='walk'?'idle':p.act;k=0}
      else{st=p.act==='walk'?'walk':p.act;k=1;if((p.act==='phone'||p.act==='pizza')&&pd<12&&R()<dt*.25)say(p,p.act);sp=p.act==='pizza'?2.6:2;if(R()<.002)p.pause=rr(1.5,4)}
  }
  if(sp>0){if(p.flee>0||!(p.onPath||pedSnap(p))){p.onPath=false;p.cross=null;if(R()<.005&&p.flee<=0)p.rot+=rr(-1.5,1.5);
      const nx=p.x+Math.sin(p.rot)*sp*dt,nz=p.z+Math.cos(p.rot)*sp*dt;if(hit(nx,nz,.6))p.rot+=Math.PI*.7;else{p.x=nx;p.z=nz}}
    else if(pedWalk(p,sp,dt)==='wait'){st=st==='walk'||st==='jog'||st==='skate'?'idle':st;k=0}}
  p.mesh.position.set(p.x,0,p.z);p.mesh.rotation.y=p.rot;pose(p.mesh,st,p.t,k)}
// 把行人吸附到最近的人行道路线上
function pedSnap(p){const i=Math.floor((p.x+HALF)/P),j=Math.floor((p.z+HALF)/P);if(!blockOK(i,j))return false;
  const c=bcen(i,j),dx=p.x-c.x,dz=p.z-c.z;
  const cand=[[0,clamp(dx+HW,0,SL),Math.abs(dz+HW)],[1,clamp(dz+HW,0,SL),Math.abs(dx-HW)],[2,clamp(HW-dx,0,SL),Math.abs(dz-HW)],[3,clamp(HW-dz,0,SL),Math.abs(dx+HW)]].sort((a,b)=>a[2]-b[2])[0];
  if(cand[2]>14)return false;p.bi=i;p.bj=j;p.s=cand[0]*SL+cand[1];p.dir=p.dir||(R()<.5?1:-1);p.onPath=true;return true}
function pedWalk(p,sp,dt){
  if(p.cross){const c=p.cross;
    if(c.wait){if(cars.some(o=>!o.dead&&o!==player.car&&Math.abs(o.speed)>2&&Math.hypot(o.x-c.mx,o.z-c.mz)<18))return'wait';c.wait=0}
    c.t=Math.min(1,c.t+sp*dt/c.len);p.x=c.x0+(c.x1-c.x0)*c.t;p.z=c.z0+(c.z1-c.z0)*c.t;p.rot=Math.atan2(c.x1-c.x0,c.z1-c.z0);
    if(c.t>=1){p.bi=c.i;p.bj=c.j;p.s=c.s1;p.cross=null;if(R()<.5)p.dir=-p.dir}return'walk'}
  const s0=p.s;p.s+=p.dir*sp*dt;const a=sidePt(p.bi,p.bj,s0),b=sidePt(p.bi,p.bj,p.s);
  if(a.k===b.k)for(const fc of[CR,SL-CR])if((a.f-fc)*(b.f-fc)<=0&&R()<.4){const k=a.k,ni=p.bi+NB[k][0],nj=p.bj+NB[k][1];
    if(blockOK(ni,nj)){const pt=sidePt(p.bi,p.bj,k*SL+fc),s1=((k+2)%4)*SL+SL-fc,q=sidePt(ni,nj,s1);
      p.cross={x0:pt.x,z0:pt.z,x1:q.x,z1:q.z,t:0,len:Math.hypot(q.x-pt.x,q.z-pt.z),i:ni,j:nj,s1,wait:1,mx:(pt.x+q.x)/2,mz:(pt.z+q.z)/2};p.x=pt.x;p.z=pt.z;return'walk'}}
  p.x=b.x;p.z=b.z;const sa=CORN[b.k],sb=CORN[(b.k+1)%4];const want=Math.atan2((sb[0]-sa[0])*p.dir,(sb[1]-sa[1])*p.dir);p.rot+=angDiff(want,p.rot)*Math.min(1,dt*10);return'walk'}

function addHeat(v){player.heat=clamp(player.heat+v*.75,0,5);player.lastSeen=0}

      if(player.wanted===0){player.dispatch=rr(14,20);setTimeout(()=>{if(player.wanted>0)toast('有人报警了，警察正在赶来…')},1500)}else player.dispatch=Math.min(player.dispatch||0,6)}
    player.wanted=w}
  player.dispatch=(player.dispatch||0)-dt;
  const cops=cars.filter(c=>c.police&&!c.dead);let seen=updHeli(dt);

function spawnCop(){for(let k=0;k<40;k++){const i=(R()*(N+1))|0,j=(R()*(N+1))|0,n=node(i,j),d=Math.hypot(n.x-player.x,n.z-player.z);
  if(nodeOK(i,j)&&d>150&&d<260){const c=makeCar(n.x,n.z,Math.atan2(player.x-n.x,player.z-n.z),{police:true,kind:player.wanted>=3&&R()<.5?'suv':'police'});return c}}}
function driveCop(c,dt){if(c.patrol&&c.driver==='ai'&&player.wanted===0){driveAI(c,dt);return}

  const want=Math.atan2(tx-c.x,tz-c.z);let diff=((want-c.h+Math.PI*3)%(Math.PI*2))-Math.PI;const d=Math.hypot(tx-c.x,tz-c.z);
  if(c.rev>0){c.rev-=dt;carPhysics(c,-1,-clamp(diff*2,-1,1),false,dt);return}
  const near=d<17&&(!player.car||Math.abs(player.car.speed)<4);carPhysics(c,near?0:1,clamp(diff*2.5,-1,1),near||Math.abs(diff)>1.2&&c.speed>18,dt);

  if(near&&Math.abs(c.speed)<5&&!c.dropped){c.dropped=1;const n=player.wanted>=4?2:1;

      const o=spawnPed(c.x+Math.cos(c.h)*(k?-4.5:4.5),c.z-Math.sin(c.h)*(k?-4.5:4.5),lk);if(o){o.cop=1;o.act='cop';o.gun=weaponMesh('pistol');o.mesh.userData.rig.hands[1].add(o.gun);o.shootT=rr(.8,1.6)}}}

  boarding={car:best,mode:'in',t:0,sx:player.x,sz:player.z,done:false}}
function updBoard(dt){const b=boarding,c=b.car;b.t+=dt;
  if(c.dead){setDoor(c,0);c.hold=0;player.mesh.visible=true;boarding=null;return}
  const st=doorStand(c),se=seatPt(c),face=Math.atan2(-Math.cos(c.h),Math.sin(c.h));let pz='idle',k=0;
  if(b.mode==='in'){
    const t=b.t;
    if(t<.45){const f=ease(t/.45);player.x=b.sx+(st.x-b.sx)*f;player.z=b.sz+(st.z-b.sz)*f;player.rot=Math.atan2(st.x-b.sx,st.z-b.sz)||face;pz='walk';k=1}
    else if(t<.8){if(!b.opened){b.opened=1;b.jack=!!c.driverMesh;if(b.jack)c.jacking=true;boardEffects(c)}player.x=st.x;player.z=st.z;player.rot+=angDiff(face,player.rot)*Math.min(1,dt*14);setDoor(c,ease((t-.45)/.3))}
    else if(b.jack&&t<1.8){ // 拽司机：玩家伸手往外拉，司机从座位被拖出、摔在地上
      player.x=st.x;player.z=st.z;player.rot=face;const f=ease((t-.8)/.8);pz='punch';k=0;b.ex=Math.min(1,(t-.8)*2.2);
      const dm=b.dm||(b.dm=jackStart(c));if(!dm.userData.adopted){const out=carPt(c,(c.mesh.userData.halfW+3.2)*CS,c.mesh.userData.doorZ*CS);
      dm.position.set(b.sp.x+(out.x-b.sp.x)*f,b.sp.y*(1-f)+(f>.75?(.35*(f-.75)/.25):0),b.sp.z+(out.z-b.sp.z)*f);
      dm.scale.setScalar(b.sk+(1-b.sk)*f);dm.rotation.set(f>.7?-Math.PI/2*(f-.7)/.3:0,c.h+Math.PI/2*f,0);pose(dm,f<.5?'sit':'idle',t,0)}
      if(t>1.15&&!b.thud&&f>.85){b.thud=1;SFX.punch();say(jackPed(c,dm),'hurt')}}
    else if(b.jack&&!b.done2){b.done2=1;b.t=.8;b.jack=false}
    else if(t<1.15){const f=ease((t-.8)/.35);player.x=st.x+(se.x-st.x)*f;player.z=st.z+(se.z-st.z)*f;player.rot+=angDiff(c.h,player.rot)*Math.min(1,dt*10);pz=f>.4?'sit':'walk';k=.6}
    else{seatPlayer(c);setDoor(c,1-ease((t-1.15)/.3));
      if(t>1.45){setDoor(c,0);c.hold=0;c.driver='player';player.car=c;boarding=null;toast((SPECS[c.kind]||SPECS.sedan).name);beep(300,.1);beep(450,.1);return}}
  }else{ // 下车：开门 → 走出来 → 关门
    const t=b.t;
    if(t<.3)setDoor(c,ease(t/.3));
    else if(t<.7){player.mesh.visible=true;const f=ease((t-.3)/.4);player.x=se.x+(st.x-se.x)*f;player.z=se.z+(st.z-se.z)*f;player.rot=face;pz=f<.4?'sit':'walk';k=.6}
    else{setDoor(c,1-ease((t-.7)/.3));player.rot+=angDiff(c.h,player.rot)*Math.min(1,dt*8);
      if(t>1.0){setDoor(c,0);c.hold=0;boarding=null;if(hit(player.x,player.z,.6)){player.x=c.x-Math.cos(c.h)*4.2;player.z=c.z+Math.sin(c.h)*4.2}}}
  }
  if(b.mode==='in'&&b.t>=1.15&&!b.jack)return;
  player.t+=dt;player.y=0;player.mesh.scale.setScalar(1);player.mesh.rotation.x=0;player.mesh.position.set(player.x,0,player.z);player.mesh.rotation.y=player.rot;pose(player.mesh,pz,player.t,k,b.ex||0)}
