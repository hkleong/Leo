<title>霓虹湾</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#0b0f1a;--fg:#f4f1ff;--hot:#ff3d8b;--sun:#ffb347;--sea:#22d3ee;--ui:rgba(10,12,24,.72);color-scheme:dark;
--disp:"Bungee",Impact,system-ui,sans-serif;--body:"Rubik",system-ui,sans-serif}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
[hidden]{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none}
.tl{position:absolute;top:calc(122px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px}
.tr{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
#money{font-family:var(--disp);font-size:22px;color:#7dff9b;text-shadow:0 2px 0 #000;font-variant-numeric:tabular-nums}
#stars{font-size:24px;letter-spacing:2px;color:#444;text-shadow:0 2px 0 #000}
#stars b{color:var(--sun)}
#hp{width:104px;height:10px;background:#300;border:2px solid #000;border-radius:3px}
#hp i{display:block;height:100%;background:linear-gradient(90deg,#ff3d3d,#ff8a5c);width:100%}
#mission{background:var(--ui);padding:6px 10px;border-left:4px solid var(--hot);border-radius:4px;max-width:200px;font-size:13px}
#mission b{font-family:var(--disp);font-size:12px;color:var(--hot);letter-spacing:.06em;display:block}
#speed{font-family:var(--disp);font-size:20px;color:var(--sea);text-shadow:0 2px 0 #000}
#mini{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));width:104px;height:104px;border-radius:50%;border:3px solid #000;background:#123;box-shadow:0 0 0 2px var(--hot)}
#toast{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-family:var(--disp);font-size:clamp(22px,5vw,42px);color:var(--sun);text-shadow:0 3px 0 #000,0 0 20px var(--hot);opacity:0;transition:opacity .4s;text-align:center;white-space:nowrap}
#hint{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ui);padding:6px 12px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .2s}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow-y:auto;background:linear-gradient(180deg,rgba(20,8,40,.55),rgba(20,8,40,.25) 40%,rgba(20,8,40,.8)),url(art/title.jpg) center/cover,#2a0b3d;z-index:5;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));text-align:center}
.pick{display:flex;gap:12px}
.hero{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:2px;width:132px;padding:6px 6px 8px;border:3px solid rgba(255,255,255,.25);border-radius:8px;background:rgba(20,8,40,.7);color:#fff;font-family:var(--body);cursor:pointer}
.hero img{width:100%;height:150px;object-fit:cover;object-position:top;border-radius:4px}
.hero span{font-family:var(--disp);font-size:16px;color:var(--sun)}.hero small{font-size:11px;opacity:.8}
.hero.on{border-color:var(--hot);box-shadow:0 0 18px var(--hot)}.hero:focus-visible{outline:3px solid #fff}
#title h1{font-family:var(--disp);font-size:clamp(44px,12vw,110px);margin:0;line-height:.9;color:#fff;text-shadow:4px 4px 0 #2a0b3d,8px 8px 0 rgba(0,0,0,.25)}
#title p{margin:0;max-width:520px;font-size:15px;line-height:1.6;color:#fff}
#title .keys{font-size:13px;background:rgba(0,0,0,.35);padding:10px 14px;border-radius:6px;line-height:1.8}
#start{pointer-events:auto;font-family:var(--disp);font-size:22px;padding:14px 34px;border:0;border-radius:6px;background:#2a0b3d;color:var(--sun);cursor:pointer;box-shadow:0 5px 0 #000}
#start:focus-visible{outline:3px solid #fff}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#stick{position:absolute;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);pointer-events:auto}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,61,139,.7)}
.tb{position:absolute;width:66px;height:66px;touch-action:none;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.4);color:#fff;font-family:var(--disp);font-size:13px;display:flex;align-items:center;justify-content:center;pointer-events:auto}
#touch .tb.on{background:rgba(255,61,139,.65)}
#touch .big{width:84px;height:84px;font-size:26px}
#touch[data-mode="foot"] .drive,#touch[data-mode="drive"] .foot{display:none}
@media (prefers-reduced-motion:reduce){#toast,#hint{transition:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600&display=swap">
<div id="title">
  <h1>霓虹湾</h1>
  <p>日落时分的海滨之城。你刚出狱，口袋空空。接活、飙车、甩掉警察，攒够 $30,000 买下海边那栋别墅。</p>
  <div class="pick" role="radiogroup" aria-label="选择主角">
    <button class="hero on" id="pickF" role="radio" aria-checked="true"><img src="art/hero_f.jpg" alt=""><span>玛雅</span><small>花衬衫 · 破洞牛仔裤</small></button>
    <button class="hero" id="pickM" role="radio" aria-checked="false"><img src="art/hero_m.jpg" alt=""><span>科尔</span><small>牛仔夹克 · 工装靴</small></button>
  </div>
  <button id="start">开始游戏</button>
  <div class="keys">WASD 移动·驾驶 · Shift 奔跑 · 空格 手刹 · E 上下车 · F 开火 · M 静音</div>
</div>
<div id="hud">
  <div class="tl"><div id="money">$0</div><div id="hp"><i></i></div><div id="mission"><b>任务</b><span id="mtext">走到粉色光柱接活</span></div></div>
  <div class="tr"><div id="stars"></div><div id="speed"></div></div>
  <canvas id="mini" width="300" height="300"></canvas>
  <div id="toast"></div><div id="hint"></div>
</div>
<div id="touch" data-mode="foot">
  <div id="stick" class="foot"><div id="knob"></div></div>
  <div class="tb foot" id="bRun" style="right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px))">奔跑</div>
  <div class="tb foot" id="bF" style="right:calc(104px + env(safe-area-inset-right,0px));bottom:calc(60px + env(safe-area-inset-bottom,0px))">开火</div>
  <div class="tb" id="bE" style="right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(122px + env(safe-area-inset-bottom,0px))">上下车</div>
  <div class="tb drive big" id="bL" style="left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px))">◀</div>
  <div class="tb drive big" id="bR" style="left:calc(116px + env(safe-area-inset-left,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px))">▶</div>
  <div class="tb drive big" id="bG" style="right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px));font-size:15px">油门</div>
  <div class="tb drive big" id="bB" style="right:calc(116px + env(safe-area-inset-right,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px));font-size:15px">刹车</div>
  <div class="tb drive" id="bS" style="right:calc(112px + env(safe-area-inset-right,0px));bottom:calc(130px + env(safe-area-inset-bottom,0px))">手刹</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== 基础 =====
const R=Math.random,rr=(a,b)=>a+R()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const N=8,BLK=60,RD=16,P=BLK+RD,HALF=N*P/2;
const road=i=>i*P-HALF; // 道路中心线 i=0..N
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x2b1b4a);scene.fog=new THREE.Fog(0xc8607a,110,440);
// 日落天空：顶部青蓝 → 粉紫 → 地平线橙
const sky=new THREE.Mesh(new THREE.SphereGeometry(800,24,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`varying vec3 vP;void main(){float h=vP.y;vec3 top=vec3(.05,.33,.40),mid=vec3(.86,.27,.52),hor=vec3(1.,.58,.25);
   vec3 c=h>.18?mix(mid,top,smoothstep(.18,.6,h)):mix(hor,mid,smoothstep(-.02,.18,h));
   float sd=distance(vP,normalize(vec3(.9,.06,-.3)));c+=vec3(1.,.8,.4)*smoothstep(.07,.05,sd)+vec3(1.,.5,.3)*.35*smoothstep(.5,.0,sd);gl_FragColor=vec4(c,1.);}`}));
sky.renderOrder=-1;scene.add(sky);
const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.5,900);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);
ren.shadowMap.enabled=true;document.body.prepend(ren.domElement);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
scene.add(new THREE.HemisphereLight(0xb7a2ff,0x4a2450,.85));
const sun=new THREE.DirectionalLight(0xffa86b,1.05);sun.position.set(200,90,-60);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-160,right:160,top:160,bottom:-160,far:500});sun.shadow.mapSize.set(2048,2048);
scene.add(sun,sun.target);
const M=c=>new THREE.MeshLambertMaterial({color:c});
const box=(w,h,d,c)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof c==='number'?M(c):c);m.castShadow=m.receiveShadow=true;return m};

// ===== 城市 =====
const solids=[]; // {x0,x1,z0,z1}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(N*P+40,N*P+40),M(0x2c2738));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const sea=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshLambertMaterial({color:0x1fb5c9}));
sea.rotation.x=-Math.PI/2;sea.position.y=-.6;scene.add(sea);
// 东侧沙滩
const sand=new THREE.Mesh(new THREE.PlaneGeometry(60,N*P+40),M(0xf2d59b));sand.rotation.x=-Math.PI/2;sand.position.set(HALF+50,.02,0);sand.receiveShadow=true;scene.add(sand);
// 道路线
const lineMat=new THREE.MeshBasicMaterial({color:0xf2c14e});
for(let i=0;i<=N;i++)for(let j=0;j<N;j++){
  for(let k=0;k<6;k++){const t=road(j)+RD/2+4+k*10;
    const a=new THREE.Mesh(new THREE.PlaneGeometry(.5,5),lineMat);a.rotation.x=-Math.PI/2;a.position.set(road(i),.03,t);scene.add(a);
    const b=new THREE.Mesh(new THREE.PlaneGeometry(5,.5),lineMat);b.rotation.x=-Math.PI/2;b.position.set(t,.03,road(i));scene.add(b);}
}
const pal=[0xffb3c7,0x9ff0e6,0xfff0c2,0xc7b3ff,0xffd0a8,0xf7f2f7,0x7fd8ff,0xff9fb8];
const trimPal=[0x22d3ee,0xff3d8b,0xffffff,0x8a5cff,0x2fd1b0];
const neon=[0xff3d8b,0x22d3ee,0xffe14d,0x8a5cff,0x5cff9b];
const winDark=new THREE.MeshBasicMaterial({color:0x2a2350}),winWarm=new THREE.MeshBasicMaterial({color:0xffc27a}),winCool=new THREE.MeshBasicMaterial({color:0x7fe0ff});
// 霓虹文字招牌（画布贴图）
const signWords=['HOTEL','OPEN','CAFÉ','BAR','DISCO','PIZZA','TACOS','MOTEL','24H','霓虹','海风','酒吧','夜市','LIVE','SURF','GYM'];
const signTex={};
function signMat(word,col){const k=word+col;if(signTex[k])return signTex[k];const c=document.createElement('canvas');c.width=256;c.height=96;const g=c.getContext('2d');
  const hex='#'+col.toString(16).padStart(6,'0');g.fillStyle='rgba(20,8,30,.85)';g.fillRect(0,0,256,96);g.strokeStyle=hex;g.lineWidth=5;g.strokeRect(5,5,246,86);
  g.font='bold 54px "Bungee",Impact,sans-serif';g.textAlign='center';g.textBaseline='middle';g.shadowColor=hex;g.shadowBlur=18;g.fillStyle='#fff';g.fillText(word,128,52);g.fillStyle=hex;g.globalAlpha=.55;g.fillText(word,128,52);
  const t=new THREE.CanvasTexture(c);return signTex[k]=new THREE.MeshBasicMaterial({map:t})}
function addSign(x,y,z,ry,w){const word=signWords[(R()*signWords.length)|0],col=neon[(R()*neon.length)|0];
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,w*.375),signMat(word,col));m.position.set(x,y,z);m.rotation.y=ry;scene.add(m)}
let villa=null,station=null;
for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const cx=road(i)+P/2,cz=road(j)+P/2;
  const side=new THREE.Mesh(new THREE.PlaneGeometry(BLK+4,BLK+4),M(0x9a8aa3));side.rotation.x=-Math.PI/2;side.position.set(cx,.05,cz);side.receiveShadow=true;scene.add(side);
  if(i===N-1&&j===N-1){villa={x:cx,z:cz};continue}
  if(i===1&&j===5){station={x:cx,z:cz};continue}
  if((i+j*3)%7===3){ // 公园
    const g=new THREE.Mesh(new THREE.PlaneGeometry(BLK-4,BLK-4),M(0x4fb069));g.rotation.x=-Math.PI/2;g.position.set(cx,.08,cz);scene.add(g);
    for(let k=0;k<6;k++)palm(cx+rr(-24,24),cz+rr(-24,24));continue}
  const lots=R()<.5?1:2;
  for(let a=0;a<lots;a++)for(let b=0;b<lots;b++){
    const w=BLK/lots-6,ox=cx+(a-(lots-1)/2)*BLK/lots,oz=cz+(b-(lots-1)/2)*BLK/lots;
    const dist=Math.hypot(ox,oz)/HALF,h=Math.round((rr(8,18)+(1-dist)*rr(10,60))/4)*4;
    const col=pal[(R()*pal.length)|0],trim=trimPal[(R()*trimPal.length)|0];
    const bd=box(w,h,w,col);bd.position.set(ox,h/2,oz);scene.add(bd);
    // 装饰艺术风：楼顶阶梯 + 彩色腰线
    const cap=box(w*.7,3,w*.7,col);cap.position.set(ox,h+1.5,oz);scene.add(cap);
    const t1=box(w+.6,.8,w+.6,trim);t1.position.set(ox,h-.4,oz);scene.add(t1);
    const t2=box(w+.4,.6,w+.4,trim);t2.position.set(ox,3.6,oz);scene.add(t2);
    for(let y=6;y<h-2;y+=4){const r=R(),s2=new THREE.Mesh(new THREE.BoxGeometry(w+.15,1.4,w+.15),r<.45?winWarm:r<.6?winCool:winDark);s2.position.set(ox,y,oz);scene.add(s2)}
    // 底层店面 + 霓虹招牌（朝四个街面中随机两个）
    const shop=new THREE.Mesh(new THREE.BoxGeometry(w+.1,2.2,w+.1),R()<.6?winWarm:winCool);shop.position.set(ox,1.4,oz);scene.add(shop);
    const faces=[[0,w/2+.35,0],[Math.PI,-w/2-.35,0],[Math.PI/2,0,w/2+.35],[-Math.PI/2,0,-w/2-.35]];
    for(const f of faces)if(R()<.5){const ry=f[0]+(f[0]===Math.PI/2||f[0]===-Math.PI/2?0:0);
      const dx=f[0]===Math.PI/2?w/2+.35:f[0]===-Math.PI/2?-w/2-.35:0,dz=f[0]===0?w/2+.35:f[0]===Math.PI?-w/2-.35:0;
      addSign(ox+dx,rr(5,Math.min(h-3,14)),oz+dz,f[0],Math.min(w*.6,9))}
    solids.push({x0:ox-w/2,x1:ox+w/2,z0:oz-w/2,z1:oz+w/2});
  }
  palm(cx-BLK/2+2,cz-BLK/2+2);palm(cx+BLK/2-2,cz+BLK/2-2);
}
// 路灯
const lampMat=new THREE.MeshBasicMaterial({color:0xfff0b0});
for(let i=0;i<=N;i++)for(let j=0;j<=N;j++){const x=road(i)+RD/2-.5,z=road(j)+RD/2-.5;
  const p1=box(.3,7,.3,0x3a3448);p1.position.set(x,3.5,z);scene.add(p1);
  const arm=box(2,.25,.25,0x3a3448);arm.position.set(x-1,7,z);scene.add(arm);
  const l=new THREE.Mesh(new THREE.BoxGeometry(.8,.3,.5),lampMat);l.position.set(x-1.8,6.8,z);scene.add(l)}
// 警察局（粉彩装饰艺术楼 + 警徽）
{const S=station;const b1=box(40,12,26,0xf2b8d0);b1.position.set(S.x,6,S.z-6);scene.add(b1);
 const b2=box(18,16,10,0xb8f0ec);b2.position.set(S.x,8,S.z+5);scene.add(b2);
 const can=box(44,.8,6,0x22d3ee);can.position.set(S.x,5,S.z+11);scene.add(can);
 for(let k=-1;k<=1;k+=2){const c=box(1.2,5,1.2,0xffffff);c.position.set(S.x+k*7,2.5,S.z+12.5);scene.add(c)}
 const gl=new THREE.Mesh(new THREE.BoxGeometry(14,3.5,.2),winWarm);gl.position.set(S.x,1.9,S.z+10.1);scene.add(gl);
 const bc=document.createElement('canvas');bc.width=bc.height=128;const g=bc.getContext('2d');g.fillStyle='#d9a93a';g.beginPath();
 for(let k=0;k<12;k++){const a=k/12*Math.PI*2,r=k%2?40:60;g.lineTo(64+Math.cos(a)*r,64+Math.sin(a)*r)}g.fill();g.fillStyle='#1b2a4a';g.beginPath();g.arc(64,64,30,0,7);g.fill();
 g.fillStyle='#fff';g.font='bold 22px sans-serif';g.textAlign='center';g.fillText('警',64,72);
 const badge=new THREE.Mesh(new THREE.PlaneGeometry(6,6),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(bc),transparent:true}));badge.position.set(S.x,12,S.z+10.1);scene.add(badge);
 const sg=new THREE.Mesh(new THREE.PlaneGeometry(14,2.2),signMat('POLICE',0x22d3ee));sg.position.set(S.x,6.6,S.z+14.2);scene.add(sg);
 solids.push({x0:S.x-20,x1:S.x+20,z0:S.z-19,z1:S.z+10});}
// 别墅
{const v=box(30,12,22,0xffffff);v.position.set(villa.x,6,villa.z);scene.add(v);
 const pool=new THREE.Mesh(new THREE.PlaneGeometry(16,8),new THREE.MeshBasicMaterial({color:0x37e0ff}));pool.rotation.x=-Math.PI/2;pool.position.set(villa.x,.1,villa.z+18);scene.add(pool);
 solids.push({x0:villa.x-15,x1:villa.x+15,z0:villa.z-11,z1:villa.z+11});}
for(let z=-HALF;z<HALF;z+=18)palm(HALF+30,z+rr(-4,4));
function palm(x,z){const t=box(.7,9,.7,0x8a5a3b);t.position.set(x,4.5,z);scene.add(t);
  for(let k=0;k<5;k++){const l=box(6,.3,1.2,0x2fa84f);l.position.set(x,9,z);l.rotation.y=k*1.26;l.rotation.z=-.25;l.geometry.translate(3,0,0);scene.add(l)}}
// 边界
solids.push({x0:-HALF-30,x1:-HALF-20,z0:-HALF-30,z1:HALF+30},{x0:HALF+80,x1:HALF+90,z0:-HALF-30,z1:HALF+30},
  {x0:-HALF-30,x1:HALF+90,z0:-HALF-30,z1:-HALF-20},{x0:-HALF-30,x1:HALF+90,z0:HALF+20,z1:HALF+30});
function hit(x,z,r){for(const s of solids)if(x>s.x0-r&&x<s.x1+r&&z>s.z0-r&&z<s.z1+r)return s;return null}

// ===== 输入 =====
const keys={};let touchMode=false;const stick={x:0,y:0};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE')act.enter=1;if(e.code==='KeyF')act.fire=1;if(e.code==='KeyM')toggleMute();if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=false);
const act={enter:0,fire:0};
function axis(){let x=0,y=0;
  if(keys.KeyW||keys.ArrowUp)y+=1;if(keys.KeyS||keys.ArrowDown)y-=1;if(keys.KeyA||keys.ArrowLeft)x-=1;if(keys.KeyD||keys.ArrowRight)x+=1;
  if(touchMode&&player.car){x=(tb_.R?1:0)-(tb_.L?1:0)||x;y=(tb_.G?1:0)-(tb_.B?1:0)||y}
  else if(touchMode&&(stick.x||stick.y)){x=stick.x;y=stick.y}return{x,y}}

(function(){const st=document.getElementById('stick'),kn=document.getElementById('knob');let id=null;

  const f=((performance.now()/150)|0)%2;heli.siren[0].visible=!!f;heli.siren[1].visible=!f;
  if(((performance.now()/60)|0)%3===0)beep(55,.05,'sawtooth',.015);
  return player.wanted>=3&&Math.hypot(gx-player.x,gz-player.z)<9}
function carPhysics(c,thr,steer,brake,dt){
  const max=c.police?46:40;
  if(thr>0)c.speed+=thr*(c.speed<0?40:18)*dt;else if(thr<0)c.speed+=thr*(c.speed>0?36:12)*dt;else c.speed*=1-1.2*dt;
  if(brake)c.speed*=1-3*dt;
  c.speed=clamp(c.speed,-12,max);
  c.h+=steer*clamp(c.speed/10,-1,1)*(brake?2.6:1.8)*dt;
  const nx=c.x+Math.sin(c.h)*c.speed*dt,nz=c.z+Math.cos(c.h)*c.speed*dt;
  if(hit(nx,nz,1.6)){if(Math.abs(c.speed)>14){crashFx(c);c.hp-=Math.abs(c.speed)*.6}c.speed*=-.3;}
  else{c.x=nx;c.z=nz}
  // 车与车碰撞
  for(const o of cars)if(o!==c&&!o.dead){const dx=o.x-c.x,dz=o.z-c.z,d=Math.hypot(dx,dz);
    if(d<3.6&&d>0){const p=(3.6-d)/2;c.x-=dx/d*p;c.z-=dz/d*p;o.x+=dx/d*p;o.z+=dz/d*p;
      if(Math.abs(c.speed)>10){o.speed=c.speed*.5;c.speed*=.4;if(c===player.car&&!o.police)addHeat(.3);if(c===player.car)beep(90,.15,'sawtooth',.1)}}}
  c.mesh.position.set(c.x,0,c.z);c.mesh.rotation.y=c.h;for(const w of c.mesh.userData.wheels)w.rotation.x+=c.speed*dt/.55;
  if(c.hp<=0)explode(c)}

// ===== 交通 AI =====
const node=(i,j)=>({x:road(i),z:road(j)});
function aiPickNext(c){const d=[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>{const i=c.ni+a,j=c.nj+b;return i>=0&&i<=N&&j>=0&&j<=N&&!(a===-c.dx&&b===-c.dz)});
  const[a,b]=d[(R()*d.length)|0];c.dx=a;c.dz=b;c.ni+=a;c.nj+=b}
function spawnTraffic(){const i=(R()*(N+1))|0,j=(R()*(N+1))|0;const n=node(i,j);
  if(Math.hypot(n.x-player.x,n.z-player.z)<50)return;
  const c=makeCar(n.x,n.z,0);c.ni=i;c.nj=j;c.dx=0;c.dz=0;aiPickNext(c);c.h=Math.atan2(c.dx,c.dz)}
function driveAI(c,dt){const n=node(c.ni,c.nj);const tx=n.x+c.dz*3.5,tz=n.z-c.dx*3.5;
  if(Math.hypot(tx-c.x,tz-c.z)<4)aiPickNext(c);
  const want=Math.atan2(tx-c.x,tz-c.z);let diff=((want-c.h+Math.PI*3)%(Math.PI*2))-Math.PI;
  let block=false;const fx=Math.sin(c.h),fz=Math.cos(c.h);
  const obs=[...cars.filter(o=>o!==c&&!o.dead),player.car?null:player].filter(Boolean);
  for(const o of obs){const dx=o.x-c.x,dz=o.z-c.z,f=dx*fx+dz*fz,s=Math.abs(dx*fz-dz*fx);if(f>0&&f<10&&s<2.5)block=true}
  const target=Math.abs(diff)>.4?9:16;
  carPhysics(c,block?0:(c.speed<target?.6:0),clamp(diff*2.5,-1,1),block,dt);
  if(Math.abs(c.speed)<.5&&!block){if((c.stuck+=dt)>3){c.x=tx;c.z=tz;c.stuck=0}}else c.stuck=0}

const peds=[];const shirts=[0x22d3ee,0xffe14d,0x9cffd0,0xffffff,0xff7a2f,0x8a5cff];
function spawnPed(x,z,look){if(x===undefined){const i=(R()*N)|0,j=(R()*N)|0;x=road(i)+P/2+(R()<.5?-1:1)*(BLK/2+1);z=road(j)+rr(-BLK/2,BLK/2)+P/2;
  if(Math.hypot(x-player.x,z-player.z)<40)return}
  const p={mesh:makePerson(look??NPC_KEYS[(R()*NPC_KEYS.length)|0]),x,z,rot:R()*6.28,t:R()*9,dead:0,flee:0};p.look=look;peds.push(p);return p}
function updPed(p,dt){if(p.dead){p.dead+=dt;if(p.dead>8){scene.remove(p.mesh);peds.splice(peds.indexOf(p),1)}return}
  p.t+=dt;
  if(p.cop){ // 警员：跑向玩家，贴身就扣血；没通缉了就离开
    const dx=player.x-p.x,dz=player.z-p.z,d=Math.hypot(dx,dz);
    if(player.wanted===0||d>90){scene.remove(p.mesh);peds.splice(peds.indexOf(p),1);return}
    if(!player.car){p.rot=Math.atan2(dx,dz);if(d>1.4){const sp=8.5*dt,nx=p.x+dx/d*sp,nz=p.z+dz/d*sp;if(!hit(nx,p.z,.6))p.x=nx;if(!hit(p.x,nz,.6))p.z=nz}
      else{player.hp-=(p.mesh.userData.limbs&&p.look==='swat'?26:18)*dt;if(R()<dt*2)beep(120,.08,'square',.06)}}
    for(const c of cars)if(!c.dead&&Math.abs(c.speed)>8&&Math.hypot(c.x-p.x,c.z-p.z)<2.6){killPed(p,c===player.car);addHeat(.8);break}
    p.mesh.position.set(p.x,0,p.z);p.mesh.rotation.y=p.rot;animWalk(p.mesh,p.t*1.4,!player.car&&d>1.4?1:.1);return}
  if(R()<.005)p.rot+=rr(-1.5,1.5);
  const sp=p.flee>0?7:2;p.flee-=dt;
  if(p.flee>0){p.rot=Math.atan2(p.x-player.x,p.z-player.z)}
  const nx=p.x+Math.sin(p.rot)*sp*dt,nz=p.z+Math.cos(p.rot)*sp*dt;
  if(hit(nx,nz,.6))p.rot+=Math.PI*.7;else{p.x=nx;p.z=nz}
  for(const c of cars)if(!c.dead&&Math.abs(c.speed)>8&&Math.hypot(c.x-p.x,c.z-p.z)<2.6){killPed(p,c===player.car);break}
  p.mesh.position.set(p.x,0,p.z);p.mesh.rotation.y=p.rot;animWalk(p.mesh,p.t,p.flee>0?.9:.4)}
function killPed(p,byPlayer){p.dead=.01;p.mesh.rotation.x=-Math.PI/2;p.mesh.position.y=.4;beep(160,.2,'triangle',.08);

function addHeat(v){player.heat=clamp(player.heat+v,0,5);player.lastSeen=0}
function updWanted(dt){const w=clamp(Math.ceil(player.heat-.001),0,5);
  if(w!==player.wanted){if(w>player.wanted){toast('通缉 '+'★'.repeat(w));beep(880,.3)}player.wanted=w}
  const cops=cars.filter(c=>c.police&&!c.dead);let seen=updHeli(dt);
  for(const o of peds)if(o.cop&&!o.dead&&Math.hypot(o.x-player.x,o.z-player.z)<40)seen=true;
  for(const c of cops)if(Math.hypot(c.x-player.x,c.z-player.z)<70)seen=true;
  if(seen)player.lastSeen=0;else player.lastSeen+=dt;
  if(player.wanted>0&&player.lastSeen>7){player.heat=Math.max(0,player.heat-dt*.6);if(player.heat<=0){toast('甩掉警察了');}}
  if(player.wanted>0&&cops.length<player.wanted+1&&R()<dt*.6)spawnCop();
  if(player.wanted===0)for(const c of cops)if(Math.hypot(c.x-player.x,c.z-player.z)>120){removeCar(c)}
  for(const c of cops)for(const s of c.siren)s.visible=((performance.now()/150)|0)%2===(c.siren.indexOf(s))}
function spawnCop(){for(let k=0;k<10;k++){const i=(R()*(N+1))|0,j=(R()*(N+1))|0,n=node(i,j),d=Math.hypot(n.x-player.x,n.z-player.z);
  if(d>70&&d<150){const c=makeCar(n.x,n.z,Math.atan2(player.x-n.x,player.z-n.z),{police:true,kind:player.wanted>=3&&R()<.5?'suv':'police'});return c}}}
function driveCop(c,dt){const tx=player.car?player.car.x:player.x,tz=player.car?player.car.z:player.z;
  if(player.wanted===0){driveAI2(c,dt);return}
  const want=Math.atan2(tx-c.x,tz-c.z);let diff=((want-c.h+Math.PI*3)%(Math.PI*2))-Math.PI;const d=Math.hypot(tx-c.x,tz-c.z);
  if(c.rev>0){c.rev-=dt;carPhysics(c,-1,-clamp(diff*2,-1,1),false,dt);return}
  const near=!player.car&&d<14;carPhysics(c,near?0:1,clamp(diff*2.5,-1,1),near||Math.abs(diff)>1.2&&c.speed>18,dt);
  // 停车放下警员步行追捕
  if(near&&Math.abs(c.speed)<5&&!c.dropped){c.dropped=1;const n=player.wanted>=4?2:1;
    for(let k=0;k<n;k++){const lk=player.wanted>=4?'swat':player.wanted>=5&&k?'detective':R()<.35?'copHelmet':'cop';
      const o=spawnPed(c.x+Math.cos(c.h)*(k?-2.5:2.5),c.z-Math.sin(c.h)*(k?-2.5:2.5),lk);if(o)o.cop=1}}
  if(player.car)c.dropped=0;
  if(Math.abs(c.speed)<2){if((c.stuck+=dt)>1.2){c.rev=1;c.stuck=0}}else c.stuck=0;
  if(d<5){if(player.car){if(Math.abs(c.speed)>12)player.car.hp-=8*dt*5}else if(Math.abs(c.speed)>8)player.hp-=40*dt}}
function driveAI2(c,dt){c.speed*=1-dt;carPhysics(c,0,0,true,dt)}
function removeCar(c){scene.remove(c.mesh);const i=cars.indexOf(c);if(i>=0)cars.splice(i,1);if(c===player.car)exitCar(true)}

  const f=new THREE.Mesh(new THREE.SphereGeometry(4,10,8),new THREE.MeshBasicMaterial({color:0xff8a2f,transparent:true,opacity:.9}));
  f.position.set(c.x,2,c.z);scene.add(f);fxs.push({m:f,t:0});beep(50,.8,'sawtooth',.2);
  if(c===player.car){exitCar(true);player.hp-=50}
  else{if(Math.hypot(c.x-player.x,c.z-player.z)<7)player.hp-=30;if(c.police)addHeat(1.2);else addHeat(.6)}

  let best=null,bd=45;
  for(const t of[...peds.filter(p=>!p.dead),...cars.filter(c=>!c.dead&&c!==player.car)]){const dx=t.x-player.x,dz=t.z-player.z,f=dx*fx+dz*fz,s=Math.abs(dx*fz-dz*fx);
    if(f>0&&f<bd&&s<2.2){bd=f;best=t}}
  const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(player.x,2.4,player.z),new THREE.Vector3(player.x+fx*bd,2,player.z+fz*bd)]);

  if(act.enter){act.enter=0;player.car?exitCar(false):enterCar()}
  if(act.fire){act.fire=0;if(!player.car)fire()}
  if(player.car){const c=player.car;carPhysics(c,ay,-ax,brakeHeld(),dt);player.x=c.x;player.z=c.z;player.rot=c.h;
    if(c.hp<40&&R()<.3){const sm=box(.8,.8,.8,new THREE.MeshBasicMaterial({color:0x444444,transparent:true,opacity:.6}));sm.position.set(c.x,2.5,c.z);scene.add(sm);fxs.push({m:sm,t:0,smoke:1})}}
  else{const mag=Math.min(1,Math.hypot(ax,ay)),moving=mag>.15;
    const run=keys.ShiftLeft||keys.ShiftRight||tb_.Run;
    if(moving){ // 相对镜头移动：W/上=朝镜头前方，A/D=向屏幕左右
      const want=camYaw-Math.atan2(ax,ay);
      player.rot+=angDiff(want,player.rot)*Math.min(1,dt*12);
      const sp=(run?11:5)*(touchMode?Math.max(.4,mag):1);
      tryMove(Math.sin(want)*sp*dt,Math.cos(want)*sp*dt)}
    player.t+=dt;player.mesh.position.set(player.x,0,player.z);player.mesh.rotation.y=player.rot;animWalk(player.mesh,player.t,moving?(run?1:.6):0)}
  for(const c of[...cars]){if(c.dead||c===player.car)continue;if(c.police)driveCop(c,dt);else if(c.driver==='ai')driveAI(c,dt);else{c.speed*=1-2*dt;if(Math.abs(c.speed)>.3)carPhysics(c,0,0,true,dt)}}
  for(const p of[...peds])updPed(p,dt);
  // 远处回收 + 补充
  for(const c of[...cars])if(c.driver==='ai'&&Math.hypot(c.x-player.x,c.z-player.z)>220)removeCar(c);
  for(const p of[...peds])if(Math.hypot(p.x-player.x,p.z-player.z)>200){scene.remove(p.mesh);peds.splice(peds.indexOf(p),1)}
  if(cars.filter(c=>c.driver==='ai').length<28)spawnTraffic();if(peds.length<40)spawnPed();
  if(cash.length<12&&R()<.02){const n=randNode(30);dropCash(n.x+rr(-30,30),n.z+rr(-30,30),(rr(50,300))|0)}
  for(const k of[...cash]){k.m.rotation.y+=dt*3;if(Math.hypot(k.x-player.x,k.z-player.z)<3){player.money+=k.v;beep(1200,.08,'sine',.08);scene.remove(k.m);cash.splice(cash.indexOf(k),1)}}
  for(const f of[...fxs]){f.t+=dt;if(f.smoke){f.m.position.y+=dt*3;f.m.material.opacity=.6-f.t*.4}else{f.m.scale.setScalar(1+f.t*2);f.m.material.opacity=.9-f.t}if(f.t>1.4){scene.remove(f.m);fxs.splice(fxs.indexOf(f),1)}}
  for(const t of[...tracers])if((t.t-=dt)<0){scene.remove(t.l);tracers.splice(tracers.indexOf(t),1)}
  updWanted(dt);updMission(dt);
  if(player.hp<=0)respawn();else if(!player.car&&player.wanted===0)player.hp=Math.min(100,player.hp+dt*2);
  // 相机
  { // 车上：镜头紧跟车头；步行：只在往前/侧走时慢慢转到人物身后，往后走不转镜头
    const d=angDiff(player.rot,camYaw);let rate=3;
    if(!player.car){const{x:a2,y:b2}=axis();rate=(a2||b2)?1.6*Math.max(0,Math.cos(d)+.25):0}
    camYaw+=d*Math.min(1,dt*rate)}
  const dist=player.car?11+Math.abs(player.car.speed)*.12:7,hgt=player.car?5:4;
  camPos.set(player.x-Math.sin(camYaw)*dist,hgt,player.z-Math.cos(camYaw)*dist);cam.position.lerp(camPos,Math.min(1,dt*8));
  camLook.set(player.x,player.car?1.5:2.5,player.z);cam.lookAt(camLook);
  sun.position.set(player.x-120,180,player.z+80);sun.target.position.set(player.x,0,player.z);
  hud(dt);ren.render(scene,cam)}
let camYaw=0;
function angDiff(a,b){return((a-b)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI}
function tryMove(dx,dz){if(!hit(player.x+dx,player.z,.6))player.x+=dx;if(!hit(player.x,player.z+dz,.6))player.z+=dz}
for(let k=0;k<24;k++)spawnTraffic();for(let k=0;k<35;k++)spawnPed();
{const c=makeCar(road(0)+6,road(2)+8,0,{color:0x1fb5a8,kind:'sport'});c.driver=null}
offerMission();cam.position.set(player.x,40,player.z-40);
for(const[id,k]of[['pickF','heroF'],['pickM','heroM']])$(id).addEventListener('click',()=>{setHero(k);
  for(const b of document.querySelectorAll('.hero')){const on=b.id===id;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)}});
$('start').addEventListener('click',()=>{$('title').hidden=true;running=true;last=performance.now();
  try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}toast('出狱第一天');});
step();
</script>
