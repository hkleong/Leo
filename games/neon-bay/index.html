<title>霓虹湾</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#0b0f1a;--fg:#f4f1ff;--hot:#ff3d8b;--sun:#ffb347;--sea:#22d3ee;--ui:rgba(10,12,24,.72);color-scheme:dark;
--disp:"Bungee",Impact,system-ui,sans-serif;--body:"Rubik",system-ui,sans-serif}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
[hidden]{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none}
.tl{position:absolute;top:calc(122px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px}
.tr{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
#money{font-family:var(--disp);font-size:22px;color:#7dff9b;text-shadow:0 2px 0 #000;font-variant-numeric:tabular-nums}
#stars{font-size:24px;letter-spacing:2px;color:#444;text-shadow:0 2px 0 #000}
#stars b{color:var(--sun)}
#hp{width:104px;height:10px;background:#300;border:2px solid #000;border-radius:3px}
#hp i{display:block;height:100%;background:linear-gradient(90deg,#ff3d3d,#ff8a5c);width:100%}
#mission{background:var(--ui);padding:6px 10px;border-left:4px solid var(--hot);border-radius:4px;max-width:200px;font-size:13px}
#mission b{font-family:var(--disp);font-size:12px;color:var(--hot);letter-spacing:.06em;display:block}
#speed{font-family:var(--disp);font-size:20px;color:var(--sea);text-shadow:0 2px 0 #000}
#mini{pointer-events:auto;cursor:pointer;position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));width:104px;height:104px;border-radius:50%;border:3px solid #000;background:#123;box-shadow:0 0 0 2px var(--hot)}
#toast{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-family:var(--disp);font-size:clamp(22px,5vw,42px);color:var(--sun);text-shadow:0 3px 0 #000,0 0 20px var(--hot);opacity:0;transition:opacity .4s;text-align:center;white-space:nowrap}
#hint{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ui);padding:6px 12px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .2s}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow-y:auto;background:linear-gradient(180deg,rgba(20,8,40,.55),rgba(20,8,40,.25) 40%,rgba(20,8,40,.8)),url(art/title.jpg) center/cover,#2a0b3d;z-index:5;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));text-align:center}
.pick{display:flex;gap:12px}
.hero{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:2px;width:132px;padding:6px 6px 8px;border:3px solid rgba(255,255,255,.25);border-radius:8px;background:rgba(20,8,40,.7);color:#fff;font-family:var(--body);cursor:pointer}
.hero img{width:100%;height:150px;object-fit:cover;object-position:top;border-radius:4px}
.hero span{font-family:var(--disp);font-size:16px;color:var(--sun)}.hero small{font-size:11px;opacity:.8}
.hero.on{border-color:var(--hot);box-shadow:0 0 18px var(--hot)}.hero:focus-visible{outline:3px solid #fff}
#title h1{font-family:var(--disp);font-size:clamp(44px,12vw,110px);margin:0;line-height:.9;color:#fff;text-shadow:4px 4px 0 #2a0b3d,8px 8px 0 rgba(0,0,0,.25)}
#title p{margin:0;max-width:520px;font-size:15px;line-height:1.6;color:#fff}
#title .keys{font-size:13px;background:rgba(0,0,0,.35);padding:10px 14px;border-radius:6px;line-height:1.8}
#start{pointer-events:auto;font-family:var(--disp);font-size:22px;padding:14px 34px;border:0;border-radius:6px;background:#2a0b3d;color:var(--sun);cursor:pointer;box-shadow:0 5px 0 #000}
#start:focus-visible{outline:3px solid #fff}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#stick{position:absolute;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);pointer-events:auto}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,61,139,.7)}
.tb{position:absolute;width:66px;height:66px;touch-action:none;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.4);color:#fff;font-family:var(--disp);font-size:13px;display:flex;align-items:center;justify-content:center;pointer-events:auto}
#touch .tb.on{background:rgba(255,61,139,.65)}
#touch .big{width:84px;height:84px;font-size:26px}
#touch[data-mode="foot"] .drive,#touch[data-mode="drive"] .foot{display:none}
.bm-top{display:flex;justify-content:space-between;align-items:center;width:min(92vw,92vh);font-family:var(--disp);color:var(--sun);font-size:18px}
#bigmap{position:fixed;inset:0;z-index:6;background:rgba(10,8,24,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#bigmap[hidden]{display:none}
#bmc{width:min(92vw,80vh);height:min(92vw,80vh);border-radius:12px;border:3px solid #000;box-shadow:0 0 0 2px var(--hot)}
#bmClose{font-family:var(--disp);font-size:14px;padding:8px 16px;border:0;border-radius:6px;background:var(--hot);color:#fff;cursor:pointer}
#bmClose:focus-visible,#mini:focus-visible{outline:3px solid #fff}
.bm-legend{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;font-size:13px;color:#fff}
.bm-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;border:1px solid #000;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){#toast,#hint{transition:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600&display=swap">
<div id="title">
  <h1>霓虹湾</h1>
  <p>日落时分的海滨之城。你刚出狱，口袋空空。接活、飙车、甩掉警察，攒够 $30,000 买下海边那栋别墅。</p>
  <div class="pick" role="radiogroup" aria-label="选择主角">
    <button class="hero on" id="pickF" role="radio" aria-checked="true"><img src="art/hero_f.jpg" alt=""><span>玛雅</span><small>花衬衫 · 破洞牛仔裤</small></button>
    <button class="hero" id="pickM" role="radio" aria-checked="false"><img src="art/hero_m.jpg" alt=""><span>科尔</span><small>牛仔夹克 · 工装靴</small></button>
  </div>
  <button id="start">开始游戏</button>
  <div class="keys">WASD 移动·驾驶 · Shift 奔跑 · 空格 跳跃/手刹 · Q 出拳 · X 跳舞 · E 上下车 · F 开火 · M 静音</div>
</div>
<div id="hud">
  <div class="tl"><div id="money">$0</div><div id="hp"><i></i></div><div id="mission"><b>任务</b><span id="mtext">走到粉色光柱接活</span></div></div>
  <div class="tr"><div id="stars"></div><div id="speed"></div></div>
  <canvas id="mini" width="300" height="300" role="button" aria-label="打开完整地图" tabindex="0"></canvas>
  <div id="toast"></div><div id="hint"></div>
</div>
<div id="bigmap" hidden><div class="bm-top"><b>霓虹湾地图</b><button id="bmClose" aria-label="关闭地图">关闭</button></div><canvas id="bmc"></canvas>
  <div class="bm-legend"><span><i style="background:#ff3d8b"></i>你</span><span><i style="background:#ffe14d"></i>任务</span><span><i style="background:#ff2a3a"></i>警察</span><span><i style="background:#fff"></i>别墅</span><span><i style="background:#4a7ab0"></i>警察局</span><span><i style="background:#22d3ee"></i>停车场</span><span><i style="background:#5cff7a"></i>现金</span></div></div>
<div id="touch" data-mode="foot">
  <div id="stick" class="foot"><div id="knob"></div></div>
  <div class="tb foot" id="bRun" style="right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px))">奔跑</div>
  <div class="tb foot" id="bF" style="right:calc(104px + env(safe-area-inset-right,0px));bottom:calc(60px + env(safe-area-inset-bottom,0px))">开火</div>
  <div class="tb foot" id="bJ" style="right:calc(184px + env(safe-area-inset-right,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px))">跳跃</div>
  <div class="tb foot" id="bP" style="right:calc(104px + env(safe-area-inset-right,0px));bottom:calc(140px + env(safe-area-inset-bottom,0px))">出拳</div>
  <div class="tb foot" id="bD" style="right:calc(184px + env(safe-area-inset-right,0px));bottom:calc(116px + env(safe-area-inset-bottom,0px));width:54px;height:54px;font-size:12px">跳舞</div>
  <div class="tb" id="bE" style="right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(122px + env(safe-area-inset-bottom,0px))">上下车</div>
  <div class="tb drive big" id="bL" style="left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px))">◀</div>
  <div class="tb drive big" id="bR" style="left:calc(116px + env(safe-area-inset-left,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px))">▶</div>
  <div class="tb drive big" id="bG" style="right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px));font-size:15px">油门</div>
  <div class="tb drive big" id="bB" style="right:calc(116px + env(safe-area-inset-right,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px));font-size:15px">刹车</div>
  <div class="tb drive" id="bS" style="right:calc(112px + env(safe-area-inset-right,0px));bottom:calc(130px + env(safe-area-inset-bottom,0px))">手刹</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== 基础 =====
const R=Math.random,rr=(a,b)=>a+R()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const N=8,BLK=60,RD=16,P=BLK+RD,HALF=N*P/2;
const road=i=>i*P-HALF; // 道路中心线 i=0..N
const ISL=a=>HALF*(1.0+.13*Math.sin(3*a+.8)+.08*Math.sin(5*a+2.1)+.05*Math.sin(2*a+4)+.03*Math.sin(9*a+1))+34;
const coastR=(x,z)=>ISL(Math.atan2(z,x));
const onIsland=(x,z,m=0)=>Math.hypot(x,z)<coastR(x,z)-m;
const nodeOK=(i,j)=>i>=0&&j>=0&&i<=N&&j<=N&&onIsland(road(i),road(j),26);
const blockOK=(i,j)=>nodeOK(i,j)&&nodeOK(i+1,j)&&nodeOK(i,j+1)&&nodeOK(i+1,j+1);
// 特殊街区：别墅（最东南）、警察局（偏西北）、停车场（最东）
const VALID=[];for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(blockOK(i,j))VALID.push([i,j]);
const pickBlock=(f,ex=[])=>VALID.filter(b=>!ex.some(e=>e[0]===b[0]&&e[1]===b[1])).reduce((a,b)=>f(b)>f(a)?b:a);
const VB=pickBlock(b=>b[0]+b[1]),SB=pickBlock(b=>-Math.hypot(b[0]-1,b[1]-5),[VB]),LB=pickBlock(b=>b[0]*3-Math.abs(b[1]-3.5),[VB,SB]);
const bc=b=>({x:road(b[0])+P/2,z:road(b[1])+P/2});const LOT=bc(LB);
// 出生点：最西边的路口
const SPN=(()=>{let best=null;for(let i=0;i<=N;i++)for(let j=0;j<=N;j++)if(nodeOK(i,j)){const v=road(i)*2+Math.abs(road(j)+80);if(!best||v<best.v)best={v,x:road(i),z:road(j)}}return best})();
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x2b1b4a);scene.fog=new THREE.Fog(0xc8607a,110,440);
// 日落天空：顶部青蓝 → 粉紫 → 地平线橙
const sky=new THREE.Mesh(new THREE.SphereGeometry(800,24,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`varying vec3 vP;void main(){float h=vP.y;vec3 top=vec3(.05,.33,.40),mid=vec3(.86,.27,.52),hor=vec3(1.,.58,.25);
   vec3 c=h>.18?mix(mid,top,smoothstep(.18,.6,h)):mix(hor,mid,smoothstep(-.02,.18,h));
   float sd=distance(vP,normalize(vec3(.9,.06,-.3)));c+=vec3(1.,.8,.4)*smoothstep(.07,.05,sd)+vec3(1.,.5,.3)*.35*smoothstep(.5,.0,sd);gl_FragColor=vec4(c,1.);}`}));
sky.renderOrder=-1;scene.add(sky);
const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.5,900);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);
ren.shadowMap.enabled=true;document.body.prepend(ren.domElement);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
scene.add(new THREE.HemisphereLight(0xb7a2ff,0x4a2450,.85));
const sun=new THREE.DirectionalLight(0xffa86b,1.05);sun.position.set(200,90,-60);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-160,right:160,top:160,bottom:-160,far:500});sun.shadow.mapSize.set(2048,2048);
scene.add(sun,sun.target);
// 卡通分层着色（三档明暗，接近插画的赛璐璐感），按颜色缓存材质
const toonGrad=(()=>{const t=new THREE.DataTexture(new Uint8Array([90,90,90,255,170,170,170,255,255,255,255,255]),3,1,THREE.RGBAFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;return t})();
const matCache={};const M=c=>matCache[c]||(matCache[c]=new THREE.MeshToonMaterial({color:c,gradientMap:toonGrad}));
// 圆角方块：把细分方块的顶点推到圆角面上，法线直接取圆角方向，表面平滑无接缝
const geoCache={};
function rgeo(w,h,d,k){const key=[w,h,d,k].map(v=>+v.toFixed(3)).join();if(geoCache[key])return geoCache[key];
  const r=Math.min(w,h,d)*k,seg=4,g=new THREE.BoxGeometry(w,h,d,seg,seg,seg),pos=g.attributes.position,nor=g.attributes.normal;
  const hx=w/2-r,hy=h/2-r,hz=d/2-r,v=new THREE.Vector3(),n=new THREE.Vector3();
  for(let i=0;i<pos.count;i++){v.fromBufferAttribute(pos,i);n.set(clamp(v.x,-hx,hx),clamp(v.y,-hy,hy),clamp(v.z,-hz,hz));
    const dir=v.clone().sub(n);if(dir.lengthSq()<1e-9)dir.fromBufferAttribute(nor,i);dir.normalize();v.copy(n).addScaledVector(dir,r);pos.setXYZ(i,v.x,v.y,v.z);nor.setXYZ(i,dir.x,dir.y,dir.z)}
  return geoCache[key]=g}
const rbox=(w,h,d,c,k=.42)=>{const m=new THREE.Mesh(rgeo(w,h,d,k),typeof c==='number'?M(c):c);m.castShadow=m.receiveShadow=true;return m};
const leafGeo=(()=>{const g=rgeo(6,.25,1.6,.45).clone();g.translate(3,0,0);const p=g.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i);p.setY(i,p.getY(i)-x*x*.06)}g.computeVertexNormals();return g})();
const box=(w,h,d,c)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof c==='number'?M(c):c);m.castShadow=m.receiveShadow=true;return m};

// ===== 城市 =====
const solids=[]; // {x0,x1,z0,z1}
function islandShape(m){const sh=new THREE.Shape();for(let k=0;k<=160;k++){const a=k/160*Math.PI*2,r=ISL(a)-m;const x=Math.cos(a)*r,z=Math.sin(a)*r;k?sh.lineTo(x,-z):sh.moveTo(x,-z)}return sh}
const flat=(sh,col,y)=>{const m=new THREE.Mesh(new THREE.ShapeGeometry(sh,2),M(col));m.rotation.x=-Math.PI/2;m.position.y=y;m.receiveShadow=true;scene.add(m);return m};
flat(islandShape(-6),0x7fd6d0,-.35); // 浅水
flat(islandShape(0),0xf2d59b,0);       // 沙滩
flat(islandShape(26),0x6fbf73,.01);    // 草地
const asphalt=M(0x2c2738);
for(let i=0;i<=N;i++)for(let j=0;j<=N;j++){if(!nodeOK(i,j))continue;
  const sq=new THREE.Mesh(new THREE.PlaneGeometry(RD,RD),asphalt);sq.rotation.x=-Math.PI/2;sq.position.set(road(i),.02,road(j));sq.receiveShadow=true;scene.add(sq);
  if(nodeOK(i+1,j)){const r=new THREE.Mesh(new THREE.PlaneGeometry(P,RD),asphalt);r.rotation.x=-Math.PI/2;r.position.set(road(i)+P/2,.02,road(j));r.receiveShadow=true;scene.add(r)}
  if(nodeOK(i,j+1)){const r=new THREE.Mesh(new THREE.PlaneGeometry(RD,P),asphalt);r.rotation.x=-Math.PI/2;r.position.set(road(i),.02,road(j)+P/2);r.receiveShadow=true;scene.add(r)}}
const sea=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshLambertMaterial({color:0x1fb5c9}));
sea.rotation.x=-Math.PI/2;sea.position.y=-.6;scene.add(sea);
// 东侧沙滩

// 道路线
const lineMat=new THREE.MeshBasicMaterial({color:0xf2c14e});
for(let i=0;i<=N;i++)for(let j=0;j<N;j++){
  for(let k=0;k<6;k++){const t=road(j)+RD/2+4+k*10;
    if(nodeOK(i,j)&&nodeOK(i,j+1)){const a=new THREE.Mesh(new THREE.PlaneGeometry(.5,5),lineMat);a.rotation.x=-Math.PI/2;a.position.set(road(i),.03,t);scene.add(a)}
    if(nodeOK(j,i)&&nodeOK(j+1,i)){const b=new THREE.Mesh(new THREE.PlaneGeometry(5,.5),lineMat);b.rotation.x=-Math.PI/2;b.position.set(t,.03,road(i));scene.add(b)}}
}
const pal=[0xffb3c7,0x9ff0e6,0xfff0c2,0xc7b3ff,0xffd0a8,0xf7f2f7,0x7fd8ff,0xff9fb8];
const trimPal=[0x22d3ee,0xff3d8b,0xffffff,0x8a5cff,0x2fd1b0];
const neon=[0xff3d8b,0x22d3ee,0xffe14d,0x8a5cff,0x5cff9b];
const winDark=new THREE.MeshBasicMaterial({color:0x2a2350}),winWarm=new THREE.MeshBasicMaterial({color:0xffc27a}),winCool=new THREE.MeshBasicMaterial({color:0x7fe0ff});
// 霓虹文字招牌（画布贴图）
const signWords=['HOTEL','OPEN','CAFÉ','BAR','DISCO','PIZZA','TACOS','MOTEL','24H','霓虹','海风','酒吧','夜市','LIVE','SURF','GYM'];
const signTex={};
function signMat(word,col){const k=word+col;if(signTex[k])return signTex[k];const c=document.createElement('canvas');c.width=256;c.height=96;const g=c.getContext('2d');
  const hex='#'+col.toString(16).padStart(6,'0');g.fillStyle='rgba(20,8,30,.85)';g.fillRect(0,0,256,96);g.strokeStyle=hex;g.lineWidth=5;g.strokeRect(5,5,246,86);
  g.font='bold 54px "Bungee",Impact,sans-serif';g.textAlign='center';g.textBaseline='middle';g.shadowColor=hex;g.shadowBlur=18;g.fillStyle='#fff';g.fillText(word,128,52);g.fillStyle=hex;g.globalAlpha=.55;g.fillText(word,128,52);
  const t=new THREE.CanvasTexture(c);return signTex[k]=new THREE.MeshBasicMaterial({map:t})}
function addSign(x,y,z,ry,w){const word=signWords[(R()*signWords.length)|0],col=neon[(R()*neon.length)|0];
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,w*.375),signMat(word,col));m.position.set(x,y,z);m.rotation.y=ry;scene.add(m)}
let villa=null,station=null;const parkSpots=[];
for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  if(!blockOK(i,j))continue;
  const cx=road(i)+P/2,cz=road(j)+P/2;
  const side=new THREE.Mesh(new THREE.PlaneGeometry(BLK+4,BLK+4),M(0x9a8aa3));side.rotation.x=-Math.PI/2;side.position.set(cx,.05,cz);side.receiveShadow=true;scene.add(side);
  if(i===VB[0]&&j===VB[1]){villa={x:cx,z:cz};continue}
  if(i===SB[0]&&j===SB[1]){station={x:cx,z:cz};continue}
  if(i===LB[0]&&j===LB[1])continue;

  const hy=2.6;

  for(const sd of[-1,1]){B.add(sph(.045,8,6),skin,[sd*.2,hy,0],[0,0,0],[.6,1,.8]);
    B.add(sph(.034,8,6),0xffffff,[sd*.075,hy+.03,.18],[0,0,0],[1.2,.9,.6]);B.add(sph(.02,8,6),0x2a1a12,[sd*.075,hy+.03,.2],[0,0,0],[1,1,.6]);
    B.add(rgeo(.095,.022,.03,.4),L.hairCol??dark,[sd*.078,hy+.095,.18],[0,0,sd*-.12])}
  B.add(sph(.035,8,6),skin,[0,hy-.03,.215],[0,0,0],[.9,1.3,1]);
  B.add(rgeo(.08,.018,.02,.4),fem?0xb0405a:0x7a3a34,[0,hy-.12,.19]);
  if(L.beard)B.add(sph(L.stubble?.203:.208,14,8,Math.PI/2-1.25,2.5,Math.PI*.6,Math.PI*.36),L.beardCol??0x2a1a12,[0,hy,.008],[0,0,0],[1,1.16,1.05]);
  if(L.mustache)B.add(rgeo(.12,.03,.03,.4),hairC,[0,hy-.085,.2]);
  // 头发
  const hk=[1,1.16,1.05],cap=(r,tl,col=hairC)=>B.add(sph(r,16,8,0,Math.PI*2,0,tl),col,[0,hy+.01,-.005],[0,0,0],hk);
  const back=(r,tl,col=hairC)=>B.add(sph(r,14,8,Math.PI*1.5-1.7,3.4,0,tl),col,[0,hy,-.01],[0,0,0],hk);

  else if(L.hair==='pony'){cap(.216,Math.PI*.42);back(.214,Math.PI*.62);B.add(capsule(.075,.05,.42),hairC,[0,hy+.14,-.22],[-.55,0,0]);
    for(let k=0;k<4;k++)B.add(sph(.06,8,6),hairC,[(k-1.5)*.05,hy-.05-k*.05,-.36-k*.03]);if(L.band)B.add(tor(.205,.022),L.band,[0,hy+.12,0],[Math.PI/2+.25,0,0],[1,1.05,1])}
  else if(L.hair==='bun'){cap(.214,Math.PI*.42);back(.212,Math.PI*.6);B.add(sph(.09,10,8),hairC,[0,hy+.12,-.2])}
  else if(L.hair==='curly'){cap(.22,Math.PI*.42);for(let k=0;k<26;k++){const a=R()*Math.PI*2,t=rr(.1,1.25);const x=Math.sin(t)*Math.cos(a)*.24,y=Math.cos(t)*.27,z=Math.sin(t)*Math.sin(a)*.24;
    if(z>.12&&y<.18)continue;B.add(sph(rr(.075,.11),8,6),hairC,[x,hy+y,z-.02])}for(let k=0;k<10;k++)B.add(sph(rr(.08,.11),8,6),hairC,[rr(-.24,.24),hy-rr(.05,.45),rr(-.22,-.08)])}
  // 帽子
  const hc=L.hatCol,ht=L.hat;
  if(ht==='capBack'){B.add(sph(.225,16,8,0,Math.PI*2,0,Math.PI*.5),hc,[0,hy+.04,0],[0,0,0],hk);B.add(rgeo(.24,.025,.18,.3),hc,[0,hy+.08,-.27],[-.15,0,0])}
  else if(ht==='bucket'){B.add(cyl(.19,.235,.17),hc,[0,hy+.22,0]);B.add(cyl(.34,.34,.02,18),hc,[0,hy+.13,0],[.06,0,0])}
  else if(ht==='fedora'){B.add(cyl(.18,.225,.2),hc,[0,hy+.25,0]);B.add(cyl(.38,.38,.02,18),hc,[0,hy+.15,0],[.05,0,0]);B.add(cyl(.228,.228,.05),0x1a1a1a,[0,hy+.18,0])}

  else if(ht==='fullhelmet'){B.add(sph(.27,16,12),hc,[0,hy+.02,-.01],[0,0,0],[1,1.08,1.08]);B.add(sph(.272,14,8,Math.PI/2-.9,1.8,Math.PI*.36,Math.PI*.3),0x1a1a2a,[0,hy+.02,0],[0,0,0],[1,1.08,1.08])}
  else if(ht==='bandana'){B.add(sph(.218,16,8,0,Math.PI*2,0,Math.PI*.44),hc,[0,hy+.01,0],[0,0,0],hk);B.add(sph(.05,6,6),hc,[0,hy+.05,-.24])}
  if(L.glasses!==undefined&&ht!=='fullhelmet'){for(const sd of[-1,1])B.add(cyl(.05,.05,.02,12),L.glasses,[sd*.077,hy+.03,.2],[Math.PI/2,0,0]);B.add(rgeo(.06,.015,.015,.4),0x111111,[0,hy+.04,.205])}
  if(L.glassesUp)for(const sd of[-1,1])B.add(cyl(.045,.045,.02,10),0x2a1a2a,[sd*.075,hy+.2,.14],[Math.PI/2-.9,0,0]);
  if(L.hoops)for(const sd of[-1,1])B.add(tor(.035,.006),0xe0b040,[sd*.205,hy-.1,0],[0,Math.PI/2,0]);
  // —— 骨架：躯干（含头和手臂）挂在髋部 spine 上，方便前倾、扭腰

  // —— 腿：大腿（绕髋）+ 小腿（绕膝）

    if(L.ripped&&z>.03&&((y<-.56&&y>-.66)||(y<-.27&&y>-.31)||(y<-.86&&y>-.9)))return 0xf2ece0;
    if(L.legStripe&&Math.abs(x)>.075)return L.legStripe;return pantsC};
  const KN=.62;

    const fy=-.74;

    else if(L.blades){SB.add(rgeo(.17,.3,.34,.4),L.shoes,[0,fy+.08,.04]);SB.add(rgeo(.05,.05,.4,.3),0x222222,[0,fy-.1,.04]);for(let k=0;k<4;k++)SB.add(cyl(.045,.045,.04,10),0xff7a2f,[0,fy-.16,-.12+k*.11],[0,0,Math.PI/2])}
    else if(L.sandals){SB.add(rgeo(.13,.08,.27,.45),skin,[0,fy+.02,.05]);SB.add(rgeo(.15,.035,.31,.3),L.shoes,[0,fy-.05,.05]);SB.add(rgeo(.15,.03,.06,.3),L.shoes,[0,fy+.04,.08])}
    else{SB.add(rgeo(.16,L.boots?.24:.14,.33,.4),L.shoes,[0,L.boots?fy+.04:fy,.05]);SB.add(rgeo(.165,.04,.34,.3),L.boots?0x2a1a10:0xf0f0f0,[0,fy-.06,.05])}
    kn.add(SB.build());hips.push(hp);knees.push(kn)}
  // —— 手臂：上臂（绕肩）+ 小臂（绕肘）

  const sleeveC=L.jacketMat?null:(L.jacket??shirtC);
  const armCol=(x,y,z)=>{if(L.gloves&&y<-.78)return 0x111111;if(y>-sl&&!L.jacketMat&&!L.shirtMat)return sleeveC;if(L.tattoo&&y<-.1&&y>-.75&&Math.sin(y*40+x*30)>.2)return 0x3a4a5a;return skin};

// ===== 动作：每帧根据状态摆姿势 =====
// st：idle 站立 / walk 走 / run 跑 / jump 跳 / punch 出拳 / aim 举枪 / dance 跳舞 / phone 打电话 / selfie 自拍 /
//     sit 坐 / wave 招手 / talk 聊天比划 / pizza 端披萨 / coffee 端咖啡 / skate 滑轮滑 / jog 慢跑 / down 倒地
function pose(g,st,t,k=1,extra=0){const r=g.userData.rig;if(!r)return;
  const{spine,hips,knees,shs,els}=r;
  spine.rotation.set(0,0,0);spine.position.y=1.38;
  for(const h of hips)h.rotation.set(0,0,0);for(const n of knees)n.rotation.set(0,0,0);
  for(const s of shs)s.rotation.set(0,0,s.userData.z0);for(const e of els)e.rotation.set(-.12,0,0);
  const walkLegs=(ph,amp,kb)=>{const s=Math.sin(ph);hips[0].rotation.x=s*amp;hips[1].rotation.x=-s*amp;
    knees[0].rotation.x=kb*Math.max(0,-Math.cos(ph))+.05;knees[1].rotation.x=kb*Math.max(0,Math.cos(ph))+.05;return s};
  const swingArms=(s,amp,elb)=>{shs[0].rotation.x=-s*amp;shs[1].rotation.x=s*amp;els[0].rotation.x=-elb;els[1].rotation.x=-elb};
  let ph=t*10;
  switch(st){
    case'walk':{const s=walkLegs(ph,.5*k,.9*k);swingArms(s,.45*k,.35);spine.position.y+=Math.abs(Math.cos(ph))*.04*k;break}
    case'run':{ph=t*13;const s=walkLegs(ph,.85,1.5);swingArms(s,.9,1.5);spine.rotation.x=.18;spine.position.y+=Math.abs(Math.cos(ph))*.08;break}
    case'jog':{ph=t*11;const s=walkLegs(ph,.65,1.2);swingArms(s,.6,1.4);spine.rotation.x=.1;spine.position.y+=Math.abs(Math.cos(ph))*.06;break}
    case'skate':{ph=t*4;const s=Math.sin(ph);hips[0].rotation.z=-Math.max(0,s)*.35;hips[1].rotation.z=Math.max(0,-s)*.35;
      for(const n of knees)n.rotation.x=.45;for(const h of hips)h.rotation.x-=.35;spine.rotation.x=.3;spine.position.y-=.12;
      shs[0].rotation.x=s*.7;shs[1].rotation.x=-s*.7;els[0].rotation.x=els[1].rotation.x=-.4;break}
    case'jump':{for(const h of hips)h.rotation.x=-.7;for(const n of knees)n.rotation.x=1.3;
      shs[0].rotation.z=-1.2;shs[1].rotation.z=1.2;els[0].rotation.x=els[1].rotation.x=-.6;spine.rotation.x=.12;break}
    case'punch':{const p=Math.sin(Math.min(1,extra)*Math.PI);spine.rotation.y=-.35*p;
      shs[1].rotation.x=-1.5*p-.2;els[1].rotation.x=-1.9*(1-p)-.1;shs[0].rotation.x=-.6;els[0].rotation.x=-2.0;
      hips[0].rotation.x=-.3;hips[1].rotation.x=.25;knees[0].rotation.x=.25;knees[1].rotation.x=.2;break}
    case'aim':{shs[1].rotation.x=-1.55;els[1].rotation.x=0;shs[0].rotation.x=-1.3;shs[0].rotation.z=.35;els[0].rotation.x=-.5;spine.rotation.y=-.15;
      if(k>0){const s=walkLegs(ph,.45*k,.8*k)}break}
    case'dance':{const b=t*8;spine.position.y-=.08+Math.abs(Math.sin(b))*.1;for(const n of knees)n.rotation.x=.35+Math.abs(Math.sin(b))*.3;for(const h of hips)h.rotation.x=-.2-Math.abs(Math.sin(b))*.15;
      spine.rotation.z=Math.sin(b/2)*.15;spine.rotation.y=Math.sin(b/4)*.4;
      shs[0].rotation.z=-2.4-Math.sin(b)*.4;shs[1].rotation.z=2.4-Math.sin(b+1)*.4;els[0].rotation.x=-.6-Math.sin(b)*.4;els[1].rotation.x=-.6-Math.cos(b)*.4;break}
    case'phone':{if(k>0){const s=walkLegs(ph,.4*k,.8*k);shs[0].rotation.x=-s*.35;}els[0].rotation.x=-.3;
      shs[1].rotation.x=-.35;shs[1].rotation.z=.55;els[1].rotation.x=-2.5;els[1].rotation.z=-.4;break}
    case'selfie':{shs[1].rotation.x=-2.2;shs[1].rotation.z=.35;els[1].rotation.x=-.25;shs[0].rotation.z=-.35;els[0].rotation.x=-1.6;
      spine.rotation.z=Math.sin(t*1.5)*.06;hips[0].rotation.z=-.08;hips[1].rotation.x=.12;knees[1].rotation.x=.25;break}
    case'sit':{spine.position.y=.78;for(const h of hips)h.rotation.x=-1.5;for(const n of knees)n.rotation.x=1.5;
      shs[0].rotation.x=shs[1].rotation.x=-.35;els[0].rotation.x=els[1].rotation.x=-.9;spine.rotation.x=-.05;break}
    case'wave':{shs[1].rotation.z=2.5;els[1].rotation.x=-.4+Math.sin(t*12)*.45;shs[0].rotation.x=0;break}
    case'talk':{const s=Math.sin(t*3);shs[0].rotation.x=-.4+s*.15;els[0].rotation.x=-1.3+Math.sin(t*5)*.3;shs[1].rotation.x=-.3-s*.2;els[1].rotation.x=-1.1+Math.cos(t*4)*.35;

function offerMission(){const n=randNode(60);mission={stage:'offer',x:n.x,z:n.z,timer:0};beamMat.color.set(0xff3d8b);setM('走到粉色光柱接新活')}
const jobs=[
 {name:'急件快递',start(){const n=randNode(200);mission.x=n.x;mission.z=n.z;mission.timer=75;mission.reward=2500;setM('把包裹送到黄色光柱，限时 75 秒');beamMat.color.set(0xffe14d)}},

];
function setM(t){document.getElementById('mtext').textContent=t}
function pay(v,msg){player.money+=v;toast(msg+'  +$'+v);beep(660,.1);setTimeout(()=>beep(990,.15),100);setTimeout(offerMission,2500);mission.stage='done';beamMat.visible=false;
  if(player.money>=GOAL&&!won){won=true;setTimeout(()=>{toast('海边别墅在东南角等你！');setM('去东南角的白色别墅')},3000)}}
let won=false,finished=false;
function fail(msg){toast(msg);mission.stage='done';beamMat.visible=false;setTimeout(offerMission,2500)}
function updMission(dt){const px=player.car?player.car.x:player.x,pz=player.car?player.car.z:player.z,d=Math.hypot(mission.x-px,mission.z-pz);
  beam.position.set(mission.x,30,mission.z);
  if(won&&!finished&&Math.hypot(villa.x-px,villa.z-pz)<30){finished=true;toast('🏝 别墅到手，你赢了！');setM('你已经是霓虹湾的传奇。继续自由逛吧。')}
  if(mission.stage==='offer'){beamMat.visible=true;if(d<5){mission.stage='run';const j=jobs[(R()*jobs.length)|0];mission.type=j;toast(j.name);beamMat.visible=true;j.start()}return}
  if(mission.stage!=='run')return;
  const t=mission.type.name;
  if(mission.timer>0){mission.timer-=dt;document.getElementById('mtext').textContent=document.getElementById('mtext').textContent.replace(/（剩 \d+ 秒）$/,'')+`（剩 ${Math.ceil(mission.timer)} 秒）`;
    if(mission.timer<=0)return fail('时间到，任务失败')}
  if(t==='急件快递'&&d<6)pay(mission.reward,'送达');
  if(t==='海滨竞速'&&d<8&&player.car){beep(880,.1);if(mission.pts.length){const p=mission.pts.shift();mission.x=p.x;mission.z=p.z}else pay(mission.reward,'冲线')}
  if(t==='偷跑车'){const c=mission.car;if(c.dead)return fail('跑车炸了');
    if(player.car!==c){mission.x=c.x;mission.z=c.z}
    else if(!mission.garage){mission.garage=randNode(150);mission.x=mission.garage.x;mission.z=mission.garage.z;setM('把跑车开到车库（绿色光柱），别撞坏了');beamMat.color.set(0x5cff7a);addHeat(1.5)}
    else if(d<7){mission.garage=null;exitCar(true);removeCar(c);pay(mission.reward,'交车')}}
  if(t==='甩掉追兵'&&player.wanted===0){mission.esc=false;pay(mission.reward,'成功脱身')}}

const $=id=>document.getElementById(id);let toastT=0;
function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;toastT=2.2}
const mini=$('mini').getContext('2d');
// —— 完整地图：点小地图打开，游戏暂停；点关闭、点空白处或按 Esc/Tab 关闭
let mapOpen=false;
function openMap(v){mapOpen=v;$('bigmap').hidden=!v;if(v)drawBigMap();else last=performance.now()}
$('mini').addEventListener('click',()=>openMap(true));$('mini').addEventListener('touchend',e=>{e.preventDefault();openMap(true)});
$('mini').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')openMap(true)});
$('bmClose').addEventListener('click',()=>openMap(false));$('bigmap').addEventListener('click',e=>{if(e.target.id==='bigmap')openMap(false)});
addEventListener('keydown',e=>{if(e.code==='Tab'&&running){e.preventDefault();openMap(!mapOpen)}else if(e.code==='Escape'&&mapOpen)openMap(false)});
function drawBigMap(){const cv=$('bmc'),dpr=Math.min(devicePixelRatio,2),W=cv.clientWidth*dpr;cv.width=cv.height=W;const g=cv.getContext('2d');
  const span=HALF*2.8+80,s=W/span;g.setTransform(s,0,0,s,W/2,W/2);
  g.fillStyle='#1fb5c9';g.fillRect(-span/2,-span/2,span,span);
  const isl=(m,c)=>{g.fillStyle=c;g.beginPath();for(let k=0;k<=160;k++){const a=k/160*Math.PI*2,r=ISL(a)-m;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.fill()};
  isl(-6,'#7fd6d0');isl(0,'#f2d59b');isl(26,'#79c27c');
  g.fillStyle='#55505f';for(let i=0;i<=N;i++)for(let j=0;j<=N;j++){if(!nodeOK(i,j))continue;
    if(nodeOK(i+1,j))g.fillRect(road(i)-RD/2,road(j)-RD/2,P+RD,RD);if(nodeOK(i,j+1))g.fillRect(road(i)-RD/2,road(j)-RD/2,RD,P+RD)}
  for(const[i,j]of VALID){const x=road(i)+RD/2,z=road(j)+RD/2;g.fillStyle=parkSpots.some(p=>Math.abs(p[0]-x-BLK/2)<1&&Math.abs(p[1]-z-BLK/2)<1)?'#5fb565':'#c9c0d0';g.fillRect(x,z,BLK,BLK)}
  const label=(x,z,txt,col)=>{g.fillStyle=col;g.strokeStyle='#000';g.lineWidth=3/s*dpr;g.beginPath();g.arc(x,z,12,0,7);g.fill();g.stroke();
    g.font=`bold ${26}px Rubik,system-ui,sans-serif`;g.textAlign='center';g.lineWidth=6;g.strokeText(txt,x,z-20);g.fillStyle='#fff';g.fillText(txt,x,z-20)};
  label(villa.x,villa.z,'海边别墅','#fff');label(station.x,station.z,'警察局','#4a7ab0');label(LOT.x,LOT.z,'停车场','#22d3ee');
  for(const k of cash){g.fillStyle='#5cff7a';g.beginPath();g.arc(k.x,k.z,4,0,7);g.fill()}
  for(const c of cars)if(c.police&&!c.dead){g.fillStyle='#ff2a3a';g.beginPath();g.arc(c.x,c.z,6,0,7);g.fill()}
  if(heli){g.fillStyle='#ff2a3a';g.beginPath();g.arc(heli.x,heli.z,9,0,7);g.fill()}
  if(beamMat.visible)label(mission.x,mission.z,'任务','#'+beamMat.color.getHexString());
  const px=player.car?player.car.x:player.x,pz=player.car?player.car.z:player.z,h=player.car?player.car.h:player.rot;
  g.save();g.translate(px,pz);g.rotate(-h+Math.PI);g.fillStyle='#ff3d8b';g.strokeStyle='#000';g.lineWidth=3;g.beginPath();g.moveTo(0,-16);g.lineTo(12,13);g.lineTo(-12,13);g.closePath();g.fill();g.stroke();g.restore()}
function drawMini(){const s=300/(N*P+120),cx=150,cy=150,px=player.car?player.car.x:player.x,pz=player.car?player.car.z:player.z;
  mini.fillStyle='#1fa3c4';mini.fillRect(0,0,300,300);
  mini.save();const z=2.4;mini.translate(cx,cy);mini.scale(z,z);mini.translate(-px*s,-pz*s);
  const isl=(m,c)=>{mini.fillStyle=c;mini.beginPath();for(let k=0;k<=96;k++){const a=k/96*Math.PI*2,r=(ISL(a)-m)*s;mini.lineTo(Math.cos(a)*r,Math.sin(a)*r)}mini.fill()};
  isl(0,'#f2d59b');isl(26,'#79c27c');
  mini.fillStyle='#55505f';for(let i=0;i<=N;i++)for(let j=0;j<=N;j++){if(!nodeOK(i,j))continue;
    if(nodeOK(i+1,j))mini.fillRect((road(i)-RD/2)*s,(road(j)-RD/2)*s,(P+RD)*s,RD*s);if(nodeOK(i,j+1))mini.fillRect((road(i)-RD/2)*s,(road(j)-RD/2)*s,RD*s,(P+RD)*s)}
  mini.fillStyle='#c9c0d0';for(const[i,j]of VALID)mini.fillRect((road(i)+RD/2)*s,(road(j)+RD/2)*s,BLK*s,BLK*s);
  mini.fillStyle='#fff';mini.fillRect((villa.x-15)*s,(villa.z-11)*s,30*s,22*s);
  for(const c of cars)if(c.police&&!c.dead){mini.fillStyle=((performance.now()/200)|0)%2?'#f00':'#04f';mini.fillRect(c.x*s-3,c.z*s-3,6,6)}
  if(beamMat.visible){mini.fillStyle='#'+beamMat.color.getHexString();mini.beginPath();mini.arc(mission.x*s,mission.z*s,6,0,7);mini.fill()}
  mini.restore();
  // 屏外目标箭头
  if(beamMat.visible){const dx=(mission.x-px)*s*z,dz=(mission.z-pz)*s*z;if(Math.hypot(dx,dz)>140){const a=Math.atan2(dz,dx);mini.fillStyle='#'+beamMat.color.getHexString();mini.beginPath();mini.arc(cx+Math.cos(a)*128,cy+Math.sin(a)*128,14,0,7);mini.fill()}}
  const h=player.car?player.car.h:player.rot;mini.save();mini.translate(cx,cy);mini.rotate(-h+Math.PI);
  mini.fillStyle='#ff3d8b';mini.strokeStyle='#000';mini.lineWidth=4;mini.beginPath();mini.moveTo(0,-20);mini.lineTo(15,16);mini.lineTo(-15,16);mini.closePath();mini.fill();mini.stroke();mini.restore()}
function hud(dt){$('money').textContent='$'+player.money.toLocaleString();
  $('hp').firstChild.style.width=clamp(player.hp,0,100)+'%';
  $('stars').innerHTML='<b>'+'★'.repeat(player.wanted)+'</b>'+'☆'.repeat(5-player.wanted);
  $('speed').textContent=player.car?Math.round(Math.abs(player.car.speed)*3.6)+' km/h':'';
  if(toastT>0&&(toastT-=dt)<=0)$('toast').style.opacity=0;
  let hint='';if(!player.car&&cars.some(c=>!c.dead&&Math.hypot(c.x-player.x,c.z-player.z)<5.5))hint=touchMode?'点「上下车」':'按 E 上车';
  $('hint').textContent=hint;$('hint').style.opacity=hint?1:0;drawMini()}

const camPos=new THREE.Vector3(),camLook=new THREE.Vector3();let last=performance.now(),running=false;
function respawn(){toast('你倒下了…医院见');player.money=Math.floor(player.money*.9);player.heat=0;player.wanted=0;
  if(player.car)exitCar(true);player.x=SPN.x+6;player.z=SPN.z;player.hp=100;
  for(const c of cars.filter(c=>c.police))removeCar(c);if(mission.stage==='run')fail('任务失败')}
function step(){requestAnimationFrame(step);try{frame()}catch(e){console.error(e)}}
function frame(){const tm=player.car?'drive':'foot',te=document.getElementById('touch');if(te.dataset.mode!==tm){te.dataset.mode=tm;for(const k in tb_)tb_[k]=false;te.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));stick.x=stick.y=0;document.getElementById('knob').style.transform=''}
const now=performance.now(),dt=Math.min((now-last)/1000,.05);last=now;if(!running||mapOpen){ren.render(scene,cam);return}
  const{ x:ax,y:ay}=axis();
  if(act.enter){act.enter=0;player.car?exitCar(false):enterCar()}
  if(act.fire){act.fire=0;if(!player.car)fire()}
  if(player.car){act.jump=act.punch=act.dance=0;player.dancing=false}
  if(player.car){const c=player.car;carPhysics(c,ay,-ax,brakeHeld(),dt);player.x=c.x;player.z=c.z;player.rot=c.h;
    if(c.hp<40&&R()<.3){const sm=box(.8,.8,.8,new THREE.MeshBasicMaterial({color:0x444444,transparent:true,opacity:.6}));sm.position.set(c.x,2.5,c.z);scene.add(sm);fxs.push({m:sm,t:0,smoke:1})}}
  else{const mag=Math.min(1,Math.hypot(ax,ay)),moving=mag>.15;
    const run=keys.ShiftLeft||keys.ShiftRight||tb_.Run;
    if(moving){ // 相对镜头移动：W/上=朝镜头前方，A/D=向屏幕左右
      const want=camYaw-Math.atan2(ax,ay);
      player.rot+=angDiff(want,player.rot)*Math.min(1,dt*12);
      const sp=(run?11:5)*(touchMode?Math.max(.4,mag):1);
      tryMove(Math.sin(want)*sp*dt,Math.cos(want)*sp*dt)}
    if(act.jump){act.jump=0;if(player.y<=.001){player.vy=7.5;beep(520,.08,'sine',.05)}}
    player.vy=(player.vy||0)-24*dt;player.y=Math.max(0,(player.y||0)+player.vy*dt);if(player.y<=0)player.vy=0;
    if(act.punch){act.punch=0;if(!(player.punchT>0)){player.punchT=.42;setTimeout(doPunch,140)}}
    if(act.dance){act.dance=0;player.dancing=!player.dancing;if(player.dancing)toast('跳起来！')}
    if(moving||player.y>0)player.dancing=false;
    player.punchT=(player.punchT||0)-dt;player.aimT=(player.aimT||0)-dt;
    let st='idle',pk=0,ex=0;
    if(player.y>.05)st='jump';else if(player.punchT>0){st='punch';ex=(.42-player.punchT)/.42}else if(player.aimT>0){st='aim';pk=moving?1:0}
    else if(player.dancing)st='dance';else if(moving){st=run?'run':'walk';pk=1}
    player.t+=dt;player.mesh.position.set(player.x,player.y,player.z);player.mesh.rotation.y=player.rot;pose(player.mesh,st,player.t,pk,ex)}
  for(const c of[...cars]){if(c.dead||c===player.car)continue;if(c.police)driveCop(c,dt);else if(c.driver==='ai')driveAI(c,dt);else{c.speed*=1-2*dt;if(Math.abs(c.speed)>.3)carPhysics(c,0,0,true,dt)}}
  for(const p of[...peds])updPed(p,dt);
  // 远处回收 + 补充
  for(const c of[...cars])if(c.driver==='ai'&&!c.parked&&Math.hypot(c.x-player.x,c.z-player.z)>220)removeCar(c);
  for(const p of[...peds])if(Math.hypot(p.x-player.x,p.z-player.z)>200){if(p.bench)p.bench.used=null;scene.remove(p.mesh);peds.splice(peds.indexOf(p),1)}
  if(cars.filter(c=>c.driver==='ai').length<28)spawnTraffic();if(peds.length<40)spawnPed();
  if(cash.length<12&&R()<.02){const n=randNode(30);dropCash(n.x+rr(-30,30),n.z+rr(-30,30),(rr(50,300))|0)}
  for(const k of[...cash]){k.m.rotation.y+=dt*3;if(Math.hypot(k.x-player.x,k.z-player.z)<3){player.money+=k.v;beep(1200,.08,'sine',.08);scene.remove(k.m);cash.splice(cash.indexOf(k),1)}}
  for(const f of[...fxs]){f.t+=dt;if(f.smoke){f.m.position.y+=dt*3;f.m.material.opacity=.6-f.t*.4}else{f.m.scale.setScalar(1+f.t*2);f.m.material.opacity=.9-f.t}if(f.t>1.4){scene.remove(f.m);fxs.splice(fxs.indexOf(f),1)}}
  for(const t of[...tracers])if((t.t-=dt)<0){scene.remove(t.l);tracers.splice(tracers.indexOf(t),1)}
  updWanted(dt);updMission(dt);
  if(player.hp<=0)respawn();else if(!player.car&&player.wanted===0)player.hp=Math.min(100,player.hp+dt*2);
  // 相机
  { // 车上：镜头紧跟车头；步行：只在往前/侧走时慢慢转到人物身后，往后走不转镜头
    const d=angDiff(player.rot,camYaw);let rate=3;
    if(!player.car){const{x:a2,y:b2}=axis();rate=(a2||b2)?1.6*Math.max(0,Math.cos(d)+.25):0}
    camYaw+=d*Math.min(1,dt*rate)}
  const dist=player.car?10+Math.abs(player.car.speed)*.12:5.2,hgt=player.car?4.6:3;
  camPos.set(player.x-Math.sin(camYaw)*dist,hgt,player.z-Math.cos(camYaw)*dist);cam.position.lerp(camPos,Math.min(1,dt*8));
  sky.position.copy(cam.position);camLook.set(player.x,player.car?1.5:2,player.z);cam.lookAt(camLook);
  sun.position.set(player.x-120,180,player.z+80);sun.target.position.set(player.x,0,player.z);
  hud(dt);ren.render(scene,cam)}
let camYaw=0;
function angDiff(a,b){return((a-b)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI}
function tryMove(dx,dz){if(!hit(player.x+dx,player.z,.6))player.x+=dx;if(!hit(player.x,player.z+dz,.6))player.z+=dz}
for(const[cx,cz]of parkSpots)for(const[dx,dz,r]of[[-12,-8,0],[12,-8,0],[-12,10,Math.PI],[12,10,Math.PI],[0,-20,0],[0,20,Math.PI]])addBench(cx+dx,cz+dz,r);
for(let k=0;k<24;k++)spawnTraffic();for(let k=0;k<35;k++)spawnPed();
{const c=makeCar(SPN.x+6,SPN.z+8,0,{color:0x1fb5a8,kind:'wedge'});c.driver=null}
// 海滩停车场：六种车停成一排（东侧沙滩，空车可直接开走）
{const px=LOT.x-4,pz0=LOT.z-27;const lot=new THREE.Mesh(new THREE.PlaneGeometry(22,62),M(0x3a3348));lot.rotation.x=-Math.PI/2;lot.position.set(px,.04,pz0+25);lot.receiveShadow=true;scene.add(lot);
 const lm=new THREE.MeshBasicMaterial({color:0xf4f0e6});for(let k=0;k<=6;k++){const l=new THREE.Mesh(new THREE.PlaneGeometry(9,.25),lm);l.rotation.x=-Math.PI/2;l.position.set(px+4,.06,pz0+k*8.5-2);scene.add(l)}
 const sg=new THREE.Mesh(new THREE.PlaneGeometry(10,3.75),signMat('PARK',0x22d3ee));sg.position.set(px-12,5,pz0+25);sg.rotation.y=-Math.PI/2;scene.add(sg);
 [['wedge',0x1fb5a8],['convertible',0xf4f0e6],['pickup',0x15151a],['sedan',0x8a3fc8],['taxi',0xffd21f],['coupe',0xc8ccd4]].forEach(([k,col],i)=>{
   const c=makeCar(px+4,pz0+i*8.5+2.25,-Math.PI/2,{kind:k,color:col});c.driver=null;c.parked=1});}
// 合并城市静态网格：同材质的零件拼成一个网格，大幅减少绘制次数
(function mergeStatic(){const groups=new Map();
  for(const o of[...scene.children]){if(!o.isMesh||o===sky||o===beam||(o.material&&o.material.transparent)||Array.isArray(o.material))continue;
    if(!groups.has(o.material))groups.set(o.material,[]);groups.get(o.material).push(o)}
  for(const[mat,list]of groups){if(list.length<2)continue;const pos=[],nor=[],uv=[];let cast=false;
    for(const o of list){o.updateMatrix();const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();g.applyMatrix4(o.matrix);
      const P=g.attributes.position,Nn=g.attributes.normal,U=g.attributes.uv;
      for(let i=0;i<P.count;i++){pos.push(P.getX(i),P.getY(i),P.getZ(i));nor.push(Nn.getX(i),Nn.getY(i),Nn.getZ(i));uv.push(U?U.getX(i):0,U?U.getY(i):0)}
      g.dispose();cast=cast||o.castShadow;scene.remove(o)}
    const G=new THREE.BufferGeometry();G.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));G.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));G.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
    const m=new THREE.Mesh(G,mat);m.castShadow=cast;m.receiveShadow=true;scene.add(m)}})();
offerMission();cam.position.set(player.x,40,player.z-40);
for(const[id,k]of[['pickF','heroF'],['pickM','heroM']])$(id).addEventListener('click',()=>{setHero(k);
  for(const b of document.querySelectorAll('.hero')){const on=b.id===id;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)}});
$('start').addEventListener('click',()=>{$('title').hidden=true;running=true;last=performance.now();
  try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}toast('出狱第一天');});
